<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1413">
<title>Cabina CNXN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<!-- ============================================================
     CABINA CNXN  ·  app de reunión en vivo
     Archivo único. Vanilla JS + Firebase Realtime Database.

     PARA PONERLO EN PRODUCCIÓN:
       1. Creá un proyecto en console.firebase.google.com
       2. Activá Realtime Database y Authentication > Google
       3. Pegá tu config en CFG.firebase (más abajo)
       4. Subí este archivo a tu hosting
     Sin config, la app corre en MODO DEMO: los datos quedan en
     el navegador y se sincronizan entre pestañas del mismo equipo.
     ============================================================ -->

<style>
:root{
  --ground:#F2F4F3; --surface:#FFF; --surface-2:#E8ECEB; --surface-3:#DFE5E3;
  --line:#D2D9D8; --line-2:#B4BFBE;
  --ink:#131A19; --ink-2:#47534F; --ink-3:#6E7A76;
  --signal:#0C6E75; --signal-2:#DDEEEE;
  --ok:#2C7A52; --ok-bg:#DFF0E5;
  --warn:#A8720F; --warn-bg:#F7EBD3;
  --late:#A63A2C; --late-bg:#F6E0DC;
  --r:4px;
  --f-display:Archivo,"Helvetica Neue",Arial,sans-serif;
  --sh:0 1px 2px rgba(19,26,25,.06),0 8px 24px -12px rgba(19,26,25,.18);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#0E1413; --surface:#161E1D; --surface-2:#1E2827; --surface-3:#25302E;
  --line:#2A3634; --line-2:#3D4C49;
  --ink:#E8EDEC; --ink-2:#A9B5B2; --ink-3:#7C8987;
  --signal:#4FBDC2; --signal-2:#12302F;
  --ok:#5FBE87; --ok-bg:#14301F;
  --warn:#DDA43C; --warn-bg:#33260D;
  --late:#E0705E; --late-bg:#351B16;
  --sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
}}
[data-theme="dark"]{
  --ground:#0E1413; --surface:#161E1D; --surface-2:#1E2827; --surface-3:#25302E;
  --line:#2A3634; --line-2:#3D4C49;
  --ink:#E8EDEC; --ink-2:#A9B5B2; --ink-3:#7C8987;
  --signal:#4FBDC2; --signal-2:#12302F;
  --ok:#5FBE87; --ok-bg:#14301F;
  --warn:#DDA43C; --warn-bg:#33260D;
  --late:#E0705E; --late-bg:#351B16;
  --sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
}
/* pantallas de sala: siempre oscuras, se miran de lejos */
[data-screen="tv"]{
  --ground:#080C0B; --surface:#0F1514; --surface-2:#161E1D; --surface-3:#1E2827;
  --line:#212B29; --line-2:#33403D;
  --ink:#F2F6F5; --ink-2:#9DAAA7; --ink-3:#6B7876;
  --signal:#4FBDC2; --signal-2:#0F2A2A;
  --ok:#5FBE87; --ok-bg:#0F2618; --warn:#E5AC44; --warn-bg:#2B1F09; --late:#E8705B; --late-bg:#2E1611;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  min-height:100dvh; overscroll-behavior:none;
}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono,code{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
a{color:var(--signal)}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* ---------- primitivos ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--surface);border:1px solid var(--line-2);color:var(--ink);
  border-radius:var(--r);padding:9px 14px;cursor:pointer;
  font-size:14px;font-weight:500;line-height:1.2;transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--signal);border-color:var(--signal);color:#fff;font-weight:600}
[data-theme="dark"] .btn.pri,[data-screen="tv"] .btn.pri{color:#08201F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#08201F}}
.btn.pri:hover{filter:brightness(1.08)}
.btn.gh{background:transparent;border-color:transparent;color:var(--ink-3);padding:7px 9px}
.btn.gh:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{border-color:var(--late);color:var(--late)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.lg{padding:14px 22px;font-size:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.block{width:100%}

.inp,select.inp,textarea.inp{
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);
  padding:9px 11px;font-size:14.5px;width:100%;
}
.inp:focus{border-color:var(--signal);outline:none}
label.f{display:flex;flex-direction:column;gap:5px}
label.f>span{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}

.k{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.hide{display:none !important}
.muted{color:var(--ink-3)}
.tnum{font-variant-numeric:tabular-nums}

.chip{
  display:inline-flex;align-items:center;gap:5px;
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 7px;border-radius:2px;background:var(--surface-2);color:var(--ink-3);white-space:nowrap;
}
.chip.crit{background:var(--late-bg);color:var(--late)}
.chip.now{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.sig{background:var(--signal-2);color:var(--signal)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

/* ---------- shell ---------- */
.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:var(--surface);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1240px;margin:0 auto;padding:9px 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.brand{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:-.02em;white-space:nowrap}
.brand em{font-style:normal;color:var(--signal)}
.who{
  display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace;
}
.main{max-width:1240px;width:100%;margin:0 auto;padding:18px 16px 90px;flex:1}

/* ---------- barra de progreso ---------- */
.pbar{
  position:sticky;top:44px;z-index:25;background:var(--surface);
  border-bottom:1px solid var(--line);
}
.pbar-in{
  max-width:1240px;margin:0 auto;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));
}
.pcell{
  padding:9px 14px 11px;border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:4px;min-width:0;
}
.pcell:last-child{border-right:none}
.pcell .pv{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.pv.ok{color:var(--ok)} .pv.warn{color:var(--warn)} .pv.late{color:var(--late)} .pv.sig{color:var(--signal)}
.bar{display:block;height:3px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--signal);transition:width .3s}
.bar>i.ok{background:var(--ok)} .bar>i.warn{background:var(--warn)} .bar>i.late{background:var(--late)}

/* ---------- checklist ---------- */
.phase{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);
  position:sticky;top:0;z-index:2;
}
.phase .pc{color:var(--ink-3);letter-spacing:.05em}
.it{
  display:grid;grid-template-columns:auto 62px 1fr auto;gap:11px;
  padding:10px 14px;align-items:start;border-bottom:1px solid var(--line);
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
}
.it:last-child{border-bottom:none}
.it:hover{background:var(--surface-2)}
.it.ro{cursor:default}
.it.ro:hover{background:transparent}
.box{
  width:20px;height:20px;border-radius:3px;border:2px solid var(--line-2);
  flex:none;position:relative;margin-top:1px;transition:background .12s,border-color .12s;
}
.it.done .box{background:var(--ok);border-color:var(--ok)}
.it.done .box::after{
  content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;
  border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(43deg);
}
[data-screen="tv"] .it.done .box::after{border-color:#08201F}
.it .tt{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12.5px;color:var(--signal);padding-top:2px;font-variant-numeric:tabular-nums}
.it .tx{font-size:14.5px;line-height:1.4;padding-top:1px}
.it .mt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);white-space:nowrap;padding-top:4px;text-align:right}
.it.done .tx{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.it.done .tt{color:var(--ink-3)}
.it.over .tt{color:var(--late)}
.it.now{background:var(--warn-bg)}
.it.now .tt{color:var(--warn)}

/* ---------- secciones del programa ---------- */
.sec{
  display:grid;grid-template-columns:56px 1fr auto;gap:12px;
  padding:11px 14px;border-bottom:1px solid var(--line);align-items:center;
}
.sec:last-child{border-bottom:none}
.sec.live{background:var(--signal-2)}
.sec.past{opacity:.5}
.sec .sh{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sec.live .sh{color:var(--signal);font-weight:600}
.sec .st{font-size:15px;font-weight:500}
.sec .sd{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;height:100%;min-height:0}
.msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:9px;min-height:100px}
.msgs>:first-child{margin-top:auto}
.msg{display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.4}
.msg .mh{display:flex;gap:7px;align-items:baseline;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.05em}
.msg .mn{font-weight:600;text-transform:uppercase}
.msg .mw{color:var(--ink-3)}
.msg.mine .mb{color:var(--ink-2)}
.msg .mb{padding-left:1px}
.msg.dir .mb{border-left:2px solid var(--warn);padding-left:8px}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:9px 14px 0}
.quick .btn{font-size:12px;padding:5px 9px}
.chat-in{display:flex;gap:7px;padding:10px 14px;border-top:1px solid var(--line)}
.chat-in .inp{min-width:0}
.chat-in #chatPara{max-width:104px}

/* ---------- flash ---------- */
#flash{
  position:fixed;inset:0;z-index:200;display:none;
  align-items:center;justify-content:center;padding:24px;text-align:center;
  background:var(--warn);color:#1A1204;
}
#flash.on{display:flex;animation:fl .55s steps(1,end) 3}
@keyframes fl{0%,49%{opacity:1}50%,100%{opacity:.12}}
#flash .fw{max-width:900px;display:flex;flex-direction:column;gap:12px}
#flash .ff{font-family:"IBM Plex Mono",monospace;font-size:clamp(12px,2.4vw,18px);letter-spacing:.14em;text-transform:uppercase;opacity:.72}
#flash .fm{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,8vw,84px);line-height:1.02}
@media (prefers-reduced-motion:reduce){#flash.on{animation:none}}

/* ---------- pantallas de sala ---------- */
.tv{min-height:100dvh;display:flex;flex-direction:column;padding:clamp(14px,2.4vw,30px);gap:clamp(10px,1.6vw,20px)}
.tv-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap}
.tv-title{font-family:var(--f-display);font-weight:600;font-size:clamp(16px,2.2vw,26px)}
.tv-clock{font-family:"IBM Plex Mono",monospace;font-size:clamp(18px,2.6vw,32px);font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.big{
  font-family:"IBM Plex Mono",monospace;font-weight:700;font-variant-numeric:tabular-nums;
  line-height:.92;letter-spacing:-.02em;
}
.tv-now{display:flex;flex-direction:column;gap:6px;flex:1;justify-content:center;min-height:0}
.tv-lbl{font-family:"IBM Plex Mono",monospace;font-size:clamp(10px,1.3vw,14px);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.tv-sec{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,7.2vw,104px);line-height:1.02}
.tv-next{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;color:var(--ink-2);font-size:clamp(22px,3.6vw,48px);line-height:1.1}
.tv-next b{font-family:var(--f-display);font-weight:700;color:var(--ink)}
.tv-next .tv-lbl{font-size:clamp(12px,1.6vw,20px)}
/* título de la sección actual en escenario y púlpito: antes era una etiqueta chiquita */
.tv-cur{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,6.4vw,92px);line-height:1.04;color:var(--ink)}
.tv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tv-cell{background:var(--surface);padding:11px 14px 13px;display:flex;flex-direction:column;gap:3px}
.tv-cell .cv{font-family:"IBM Plex Mono",monospace;font-size:clamp(17px,2.4vw,26px);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.sem{width:100%;height:10px;border-radius:5px;background:var(--ok)}
.sem.warn{background:var(--warn)} .sem.late{background:var(--late)}
.tv-msg{
  background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);
  border-radius:var(--r);padding:14px 18px;font-family:var(--f-display);font-weight:600;
  font-size:clamp(20px,3.6vw,44px);line-height:1.1;text-align:center;
}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;align-items:center}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:9px 14px;border:none;background:none;cursor:pointer;white-space:nowrap;
  font-size:13.5px;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab.on{color:var(--ink);border-bottom-color:var(--signal)}
.tab:hover{color:var(--ink)}
.tab.filtro{
  display:inline-flex;align-items:center;gap:6px;border-bottom-color:transparent;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
  border:1px solid var(--line-2);border-radius:var(--r);margin:4px 6px 4px 0;padding:5px 10px;
}
.tab.filtro.on{border-color:var(--signal);background:var(--signal-2);color:var(--signal)}

/* ---------- layout 2 columnas ---------- */
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}

/* ---------- misc ---------- */
.center{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px}
.panel{width:100%;max-width:430px;display:flex;flex-direction:column;gap:16px}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.areabtn{
  padding:13px 10px;border:1.5px solid var(--line-2);background:var(--surface);
  border-radius:var(--r);cursor:pointer;font-family:"IBM Plex Mono",monospace;
  font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;text-align:center;
}
.areabtn.on{border-color:var(--signal);background:var(--signal-2);color:var(--signal)}
.linkrow{
  display:flex;gap:8px;align-items:center;padding:9px 12px;
  border-bottom:1px solid var(--line);font-size:13.5px;
}
.linkrow:last-child{border-bottom:none}
.linkrow .lu{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);word-break:break-all}

/* ---------- bloques del programa ---------- */
.bloque{
  padding:7px 14px 5px;background:var(--surface-2);border-bottom:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);
}

/* ---------- chat con canales ---------- */
.chat-body{display:grid;grid-template-columns:98px minmax(0,1fr);flex:1;min-height:0}
.chat-rail{
  border-right:1px solid var(--line);background:var(--surface-2);
  display:flex;flex-direction:column;overflow-y:auto;padding:5px 0;gap:1px;
}
.ch{
  display:flex;align-items:center;gap:6px;padding:7px 9px;border:none;background:none;
  cursor:pointer;text-align:left;color:var(--ink-3);border-left:2px solid transparent;
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;width:100%;
}
.ch:hover{background:var(--surface-3);color:var(--ink)}
.ch.on{color:var(--ink);border-left-color:var(--signal);background:var(--surface)}
.ch .chn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .u{
  background:var(--late);color:#fff;border-radius:99px;min-width:16px;height:16px;
  display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;padding:0 4px;
}
.chat-main{display:flex;flex-direction:column;min-height:0;min-width:0}
@media (max-width:560px){
  .chat-body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .chat-rail{flex-direction:row;border-right:none;border-bottom:1px solid var(--line);overflow-x:auto;padding:4px 6px}
  .ch{width:auto;border-left:none;border-bottom:2px solid transparent;white-space:nowrap}
  .ch.on{border-left-color:transparent;border-bottom-color:var(--signal)}
}

/* ---------- consola (monitor de cabina) ---------- */
.cons{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.cons-head{
  display:flex;align-items:center;gap:14px;padding:8px 14px;flex:none;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.ch-sep{width:1px;align-self:stretch;background:var(--line)}
.ch-item{display:flex;flex-direction:column;gap:0;line-height:1.25;min-width:0}
.ch-item b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.ch-live{
  display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:var(--r);
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
}
.ch-live.on{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.ch-live b{font-size:14px;letter-spacing:0}
.cons-body{
  flex:1;min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr) 300px;
  gap:11px;padding:11px;overflow:hidden;
}
.cons-col{display:flex;flex-direction:column;gap:11px;min-height:0;overflow-y:auto;padding-bottom:6px}
.cons-col .tabs{position:sticky;top:0;z-index:6;background:var(--ground);padding-top:3px}
.cons-col:last-child{overflow:hidden}
.cons-col:last-child .chat{height:100%;max-height:none}
.cons-kpi{display:grid;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.cons-kpi.dos{grid-template-columns:1fr 1fr}
.cons-kpi.tres{grid-template-columns:1fr 1fr 1fr}
.cons-kpi.tres b{font-size:16px}
.cons-kpi>div{background:var(--surface);padding:9px 12px 10px;display:flex;flex-direction:column;gap:3px}
.cons-kpi b{font-size:19px;font-weight:600;line-height:1}

function fmtDur(ms, signo){
  const neg = ms < 0; let s = Math.floor(Math.abs(ms)/1000);
  const h = Math.floor(s/3600); s -= h*3600;
  const m = Math.floor(s/60); s -= m*60;
  const p = n => String(n).padStart(2,"0");
  const core = h>0 ? `${h}:${p(m)}:${p(s)}` : `${m}:${p(s)}`;
  return (signo ? (neg?"−":"+") : (neg?"−":"")) + core;
}
function hhmm(ms){ const d=new Date(ms); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function hhmmss(ms){ const d=new Date(ms); return hhmm(ms)+":"+String(d.getSeconds()).padStart(2,"0"); }
function fechaLarga(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const dd = new Date(y, m-1, d);
  const dias=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  const mes=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  return `${dias[dd.getDay()]} ${d} de ${mes[m-1]}`;
}
function isoHoy(off=0){ const d=new Date(Date.now()+off*864e5);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function proximoDomingo(){ const d=new Date(); const add=(7-d.getDay())%7||7; return isoHoy(add); }
function epochDe(iso, hora){
  const [y,m,d]=iso.split("-").map(Number); const [H,M]=hora.split(":").map(Number);
  return new Date(y,m-1,d,H,M,0,0).getTime();
}
function toast(txt){
  const t=document.createElement("div"); t.className="toast"; t.textContent=txt;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2200);
}
async function copiar(txt){
  try{ await navigator.clipboard.writeText(txt); toast("Link copiado"); }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta);
    ta.select(); try{document.execCommand("copy"); toast("Link copiado");}catch(_){ toast("Copialo a mano"); }
    ta.remove();
  }
}

  try{
    firebase.initializeApp(CFG.firebase);

}

// Errores de la base: nunca en silencio. Un "permission denied" un domingo a las
// 8 de la mañana tiene que verse en pantalla, no solo en la consola del navegador.
function errDb(e){
  console.error("Firebase:", e);
  const code = String((e && e.code) || e || "");
  if(/PERMISSION_DENIED|permission/i.test(code))
    toast("Sin permiso en la base: revisá las reglas de Firebase (botón Reglas, en Admin)");
  else if(/network|unavailable|disconnected/i.test(code))
    toast("Sin conexión con la base");
  else toast("No se pudo guardar");
}

    o[sala]=base; this._escribir(o); return Promise.resolve();
  },
  borrar(sala){ const o=this._leer(); delete o[sala]; this._escribir(o); return Promise.resolve(); },
  chat(sala,msg){
    const o=this._leer(); const r=o[sala]; if(!r) return Promise.resolve();
    r.chat = r.chat||{}; r.chat["m_"+Date.now()+"_"+uid(3)] = msg;
    o[sala]=r; this._escribir(o); return Promise.resolve();
  },
  _actCbs:{},
  onActiva(alias, cb){
    const arr = this._actCbs[alias] = this._actCbs[alias]||[];
    arr.push(cb);
    const emit = ()=> cb(localStorage.getItem("cabina.activa."+alias));
    setTimeout(emit, 0);
    if(this._bc) this._bc.addEventListener("message", emit);
    window.addEventListener("storage", emit);
    return ()=>{
      this._actCbs[alias]=(this._actCbs[alias]||[]).filter(f=>f!==cb);
      if(this._bc) this._bc.removeEventListener("message", emit);
      window.removeEventListener("storage", emit);
    };
  },
  activar(alias, sala){
    if(sala) localStorage.setItem("cabina.activa."+alias, sala);
    else localStorage.removeItem("cabina.activa."+alias);
    (this._actCbs[alias]||[]).forEach(f=>f(sala||null));   // esta misma pestaña
    this._avisar();                                        // las demás
    return Promise.resolve();
  },
  _cfg:[], _inv:[],
  _leerK(k){ try{ return JSON.parse(localStorage.getItem(k)||"{}")||{}; }catch(e){ return {}; } },
  _escribirK(k,o){ localStorage.setItem(k, JSON.stringify(o)); this._avisar(); },
  onConfig(cb){ this._cfg.push(cb); setTimeout(()=>cb(this._leerK("cabina.config")),0);
    return ()=>{ this._cfg=this._cfg.filter(f=>f!==cb); }; },
  setConfig(path,val){ const o=this._leerK("cabina.config"); ponerRuta(o,path,val); this._escribirK("cabina.config",o); return Promise.resolve(); },
  esProductorEmail(email){ return Promise.resolve(!!(this._leerK("cabina.config").productores||{})[emailKey(email)]); },
  onInvitaciones(cb){ this._inv.push(cb); setTimeout(()=>cb(this._leerK("cabina.inv")),0);
    return ()=>{ this._inv=this._inv.filter(f=>f!==cb); }; },
  crearInvitacion(cod,obj){ const o=this._leerK("cabina.inv"); o[cod]=obj; this._escribirK("cabina.inv",o); return Promise.resolve(); },
  borrarInvitacion(cod){ const o=this._leerK("cabina.inv"); delete o[cod]; this._escribirK("cabina.inv",o); return Promise.resolve(); },
  leerInvitacion(cod){ return Promise.resolve(this._leerK("cabina.inv")[cod]||null); },
  aceptarInvitacion(cod,email,nombre){
    const inv=this._leerK("cabina.inv"); const i=inv[cod];
    if(!i || i.usada || i.vence < ahora()) return Promise.reject(new Error("invitación inválida"));
    const m=String(email).toLowerCase();
    i.usada=m; localStorage.setItem("cabina.inv", JSON.stringify(inv));
    const c=this._leerK("cabina.config"); ponerRuta(c,"productores/"+emailKey(m),{email:m,nombre:nombre||m,desde:ahora(),codigo:cod});
    this._escribirK("cabina.config",c); return Promise.resolve();
  }
};
// escribe obj[a][b][c] = val a partir de "a/b/c"; null borra
function ponerRuta(obj, path, val){
  const p=path.split("/").filter(Boolean); let cur=obj;
  for(let i=0;i<p.length-1;i++){ if(typeof cur[p[i]]!=="object"||cur[p[i]]==null) cur[p[i]]={}; cur=cur[p[i]]; }
  if(val==null) delete cur[p[p.length-1]]; else cur[p[p.length-1]]=val;
}

const esDueno = () => !!(S.yo && S.yo.admin && S.yo.dueno);
// pasada = cerrada, o una que nunca arrancó y ya quedó atrás
const esPasada = r => r.estado==="cerrada" || (r.estado!=="en_vivo" && (r.inicioMs||0) < ahora() - 12*3600e3);
// por defecto el voluntario ve solo lo suyo; el productor ve todo
const filtroMio = () => S.soloMio==null ? !esProductor() : S.soloMio;
function progreso(arr){ const t=(arr||[]).length, h=(arr||[]).filter(c=>c.hecho).length;
  return {t, h, pct: t? Math.round(h/t*100):0}; }

// horarios objetivo del plan: siempre desde la hora prevista de inicio
function horarios(r){
  let acc = r.inicioMs; const out=[];
  (r.secciones||[]).forEach(s=>{ out.push(acc); acc += (s.min||0)*60000; });
  return {inicios: out, fin: acc};
}
// desvío = cuánto tarde (o temprano) arrancó lo que está sonando ahora
function desvio(r){
  if(r.estado!=="en_vivo" && r.estado!=="cerrada") return 0;
  const h = horarios(r);
  const idx = r.secActiva;
  if(idx==null) return (r.cerradaEn || r.arrancoEn || ahora()) - h.fin;
  const s = (r.secciones||[])[idx];
  const arranco = s && s.arrancoEn ? s.arrancoEn : (r.arrancoEn || ahora());
  return arranco - (h.inicios[idx] != null ? h.inicios[idx] : r.inicioMs);
}
function finProyectado(r){
  const secs = r.secciones||[];
  if(r.estado!=="en_vivo") return horarios(r).fin;
  const idx = r.secActiva==null?0:r.secActiva;
  let restante = 0;
  for(let i=idx;i<secs.length;i++){
    const dur=(secs[i].min||0)*60000;
    if(i===idx && secs[i].arrancoEn){ restante += Math.max(0, dur-(ahora()-secs[i].arrancoEn)); }
    else restante += dur;
  }
  return ahora()+restante;
}
function nivel(msDesvio){
  const m = Math.abs(msDesvio)/60000;
  if(m <= CFG.semaforo.ok) return "ok";
  if(m <= CFG.semaforo.warn) return "warn";
  return "late";
}
// hora objetivo de un check pre/post
function horaCheck(r, c, fase){
  if(fase==="pre")  return (r.inicioMs||0) + (c.off||0)*60000;
  if(fase==="post") return (r.cerradaEn || horarios(r).fin) + (c.off||0)*60000;
  return null;
}
function estadoCheck(r, c, fase){
  if(c.hecho) return "done";
  if(fase==="post" && r.estado!=="cerrada") return "";
  if(fase==="pre" && r.estado==="cerrada") return "";
  const t = horaCheck(r,c,fase);
  if(fase==="vivo"){
    const idx=(r.secciones||[]).findIndex(s=>s.id===c.secId);
    if(idx>-1 && idx===r.secActiva) return "now";
    if(idx>-1 && r.secActiva!=null && idx<r.secActiva) return "over";
    return "";
  }
  if(t==null) return "";
  const n=ahora();
  if(n > t) return "over";
  if(n > t - 5*60000) return "now";
  return "";
}
// Tarde = se marcó después de su hora (pre/post, 1 min de tolerancia) o después de que terminó su sección (durante)
function checkTarde(r,c,fase){
  if(!c.hecho || !c.en) return false;
  if(fase==="vivo"){ const sec=(r.secciones||[]).find(x=>x.id===c.secId); return !!(sec && sec.terminoEn && c.en > sec.terminoEn); }
  const t=horaCheck(r,c,fase); return t!=null && c.en > t + 60000;
}
function cuantoTarde(r,c,fase){
  if(fase==="vivo"){ const sec=(r.secciones||[]).find(x=>x.id===c.secId); return sec&&sec.terminoEn ? c.en-sec.terminoEn : 0; }
  return c.en - horaCheck(r,c,fase);
}

function infoCanciones(r){
  if(!r || r.estado!=="en_vivo" || r.secActiva==null) return null;
  const sec=(r.secciones||[])[r.secActiva];
  if(!sec || !esWorship(sec) || !(sec.canciones||[]).length) return null;
  const cs=sec.canciones; const j=sec.canActiva==null?null:sec.canActiva;
  return { sec, i:r.secActiva, j, actual: j!=null?cs[j]:null, sigue: cs[j==null?0:j+1]||null, total:cs.length };
}

function parseHash(){
  const h = (location.hash||"").replace(/^#\/?/,"");
  const p = h.split("/").filter(Boolean);
  if(!p.length) return {vista:"admin"};
  if(p[0]==="r" && p[1]) return {vista:"prod", sala:p[1]};
  if(p[0]==="c" && p[1]) return {vista:"consola", sala:p[1]};
  if(p[0]==="cartel") return {vista:"cartel"};
  if(p[0]==="config") return {vista:"config"};
  if(p[0]==="estadisticas") return {vista:"estadisticas"};
  if(p[0]==="nueva") return {vista:"nueva"};
  if(p[0]==="invitacion" && p[1]) return {vista:"invitacion", cod:p[1]};
  if(p[0]==="reporte" && p[1]) return {vista:"reporte", sala:p[1]};
  if(p[0]==="oido" && p[1]) return {vista:"oido", sala:p[1]};
  if(p[0]==="llamar" && p[1]) return {vista:"llamar", sala:p[1]};
  if(p[0]==="a" && p[1]) return {vista:"area", sala:p[1]};
  if(p[0]==="v" && p[1] && p[2]) return {vista:p[2], sala:p[1]};
  return {vista:"admin"};
}

function subReunion(sala){
  if(S.unsub){ S.unsub(); S.unsub=null; }
  if(!sala){ S.r=null; render(); return; }
  S.chatBase = false;
  S.unsub = Store.onReunion(sala, r => {
      const antes = S.r;
      S.r = r;
      if(r){
        if(!S.chatBase){
          // primera carga: tomamos como leído todo lo que ya estaba, sin flashear
          const ms = Object.values(r.chat||{}).map(m=>m.en||0);
          S.ultimoChat = ms.length ? Math.max(...ms) : 0;
          S.chatBase = true;
        } else detectarFlash(antes, r);
      }
    render();
  });
}

  S.unsubConfig = Store.onConfig(c => {

    if(esDueno() && !_sembrado){

      if(!S.cfg.catalogo){ const o={}; CATALOGO_DEF.forEach((c,i)=>o[c.id]={...c,orden:i}); Store.setConfig("catalogo", o); }
      if(!S.cfg.canciones){ Store.setConfig("canciones", CANCIONES_DEF); }

function suscribir(){
  suscribirConfig();
  if(S.unsub){ S.unsub(); S.unsub=null; }
  if(S.unsubLista){ S.unsubLista(); S.unsubLista=null; }
  if(S.unsubAlias){ S.unsubAlias(); S.unsubAlias=null; }
  if(S.unsubActiva){ S.unsubActiva(); S.unsubActiva=null; }
  S.salaReal = null;   // si no, al resuscribir con el alias el early-return de abajo dejaría la reunión sin listener

  if(S.sala === CFG.alias){
    // link permanente: seguimos a la reunión que el admin marcó como activa
    S.unsubAlias = Store.onActiva(CFG.alias, real => {
      if(real === S.salaReal) return;
      S.salaReal = real; S.r = null;
      subReunion(real);
      if(!real) render();
    });
    return;
  }
  if(S.sala){ S.salaReal = S.sala; subReunion(S.sala); return; }

  // panel de admin: lista de reuniones + cuál está activa.
  // La lista solo la pide el productor: las reglas se la niegan a cualquier otro
  // y un listener rechazado muere para siempre.
  S.unsubActiva = Store.onActiva(CFG.alias, real => { S.activa = real; render(); });
  if(esProductor()){
    S.unsubLista = Store.onLista(l => {
      S.lista = (l||[]).sort((a,b)=>(b.inicioMs||0)-(a.inicioMs||0));
      render();
    });
  }
}

function ruta(){
  const {vista, sala, cod} = parseHash();
  if(vista==="invitacion" && (!S.invitacion || S.invitacion.cod!==cod)) cargarInvitacion(cod);
  const cambio = (vista!==S.vista) || (sala!==S.sala);
  S.vista = vista; S.sala = sala || null;
  if(cambio){ S.r=null; S.ultimoChat=0; S.chatBase=false; suscribir(); }
  render();
}

let flashTimer=null;
function detectarFlash(antes, r){
  const vistasConFlash = ["prod","consola","area","cabina","escenario","pulpito","live","oido"];
  if(!vistasConFlash.includes(S.vista)) return;
  // TODOS los mensajes nuevos, no solo el último: el oído puede mandar dos juntos
  // ("sonido y video, atentos") y antes solo se miraba el último.
  const nuevos = Object.entries(r.chat||{}).map(([k,v])=>({id:k,...v}))
    .filter(m=>(m.en||0) > S.ultimoChat).sort((a,b)=>(a.en||0)-(b.en||0));
  if(!nuevos.length) return;
  S.ultimoChat = Math.max(...nuevos.map(m=>m.en||0));
  const miArea = S.yo ? S.yo.areaId : null;
  const paraMi = m => {
    if(m.deId && m.deId===sesionId()) return false;          // no me flasheo a mí mismo
    const para = m.para || "todos";
    // la pantalla del oído siempre muestra sus propios avisos, sea quien sea el operador
    if(S.vista==="oido" && m.deId==="oido") return true;
    // escenario y púlpito: solo si el mensaje es para ellos. Un "Todos" no los distrae.
    if(S.vista==="escenario" || S.vista==="pulpito") return para===S.vista;
    // la TV de cabina es de todos: solo los mensajes a Todos, aunque el navegador tenga un nombre guardado
    if(S.vista==="cabina") return para==="todos";
    // el resto: lo que va a Todos, o lo que va a MI área. Un mensaje a Sonido no flashea en Video.
    return para==="todos" || (miArea && para===miArea);
  };
  const mios = nuevos.filter(paraMi);
  if(!mios.length) return;
  // si hay uno dirigido a mi área, ese es el que importa; si no, el último a Todos
  const elegido = mios.filter(m=>m.para && m.para!=="todos").pop() || mios.pop();
  lanzarFlash(elegido);
}
function lanzarFlash(m){
  const f=$("#flash"); const c = area(m.area).color;
  f.style.background = c; f.style.color = "#0B0F0E";
  $("#flashFrom").textContent = m.nombre + " · " + area(m.area).nombre + (m.para && m.para!=="todos" ? " → "+area(m.para).nombre : "");
  $("#flashMsg").textContent = m.texto;
  f.classList.remove("on"); void f.offsetWidth; f.classList.add("on");
  if(navigator.vibrate) try{ navigator.vibrate([120,70,120]); }catch(e){}
  clearTimeout(flashTimer);
  flashTimer = setTimeout(()=> f.classList.remove("on"), 1750);
}
function sesionId(){
  // por PESTAÑA, no por navegador: si fuera por navegador, dos pestañas de la
  // misma máquina se verían como la misma persona y el flash se silenciaría.
  let s = sessionStorage.getItem("cabina.sid");

}

const A = {};

A.marcar = (fase, id) => {
  const r=S.r; if(!r) return;
  const arr = r[fase]||[]; const i = arr.findIndex(c=>c.id===id); if(i<0) return;
  const c = arr[i]; const nuevo = !c.hecho;
  Store.patch(r.sala, {
    [`${fase}/${i}/hecho`]: nuevo,
    [`${fase}/${i}/por`]: nuevo ? (S.yo?S.yo.nombre:"—") : null,
    [`${fase}/${i}/en`]: nuevo ? ahora() : null
  });
};

A.iniciar = () => {
  const r=S.r; if(!r) return;
  Store.patch(r.sala, { estado:"en_vivo", arrancoEn: ahora(), secActiva:0, "secciones/0/arrancoEn": ahora() });
};
A.avanzar = (delta) => {
  const r=S.r; if(!r||r.estado!=="en_vivo") return;
  const secs=r.secciones||[]; const cur = r.secActiva==null?0:r.secActiva;
  const next = cur + delta;
  if(next<0 || next>=secs.length) return;   // la última sección se termina con "Cerrar reunión", que pregunta
  const p={};
  p[`secciones/${cur}/terminoEn`] = ahora();
  cerrarCancion(r, cur, p);
  p[`secciones/${next}/arrancoEn`] = ahora();
  p["secActiva"] = next;
  Store.patch(r.sala, p);
};
// al terminar una sección, la canción que estaba sonando termina con ella
function cerrarCancion(r, i, p){
  const sec=(r.secciones||[])[i]; if(!sec || sec.canActiva==null) return;
  const c=(sec.canciones||[])[sec.canActiva];
  if(c && c.arrancoEn && !c.terminoEn) p[`secciones/${i}/canciones/${sec.canActiva}/terminoEn`] = ahora();
}
// "▶ empezó esta canción": la marca Pantalla o el productor. Sirve para saber cuánto dura cada una.
A.cancion = (j) => {
  const r=S.r; if(!r || r.estado!=="en_vivo" || r.secActiva==null) return;
  const i=r.secActiva; const sec=(r.secciones||[])[i]; if(!sec || !esWorship(sec)) return;
  const cs=sec.canciones||[]; if(!cs[j]) return;
  const p={};
  if(sec.canActiva!=null && sec.canActiva!==j) cerrarCancion(r, i, p);
  p[`secciones/${i}/canciones/${j}/arrancoEn`] = ahora();
  p[`secciones/${i}/canciones/${j}/terminoEn`] = null;
  p[`secciones/${i}/canActiva`] = j;
  Store.patch(r.sala, p);
};
A.cancionFin = () => {
  const r=S.r; if(!r || r.secActiva==null) return;
  const p={}; cerrarCancion(r, r.secActiva, p);
  if(Object.keys(p).length) Store.patch(r.sala, p);
};
A.ajustar = (min) => {
  const r=S.r; if(!r) return;
  const i = r.secActiva; if(i==null) return;
  const s = (r.secciones||[])[i]; if(!s) return;
  const nm = Math.max(1, (s.min||0)+min);
  Store.patch(r.sala, {[`secciones/${i}/min`]: nm});
};
A.cerrar = () => {
  const r=S.r; if(!r) return;
  const p = {estado:"cerrada", cerradaEn: ahora(), secActiva:null};
  if(r.secActiva!=null){ p[`secciones/${r.secActiva}/terminoEn`]=ahora(); cerrarCancion(r, r.secActiva, p); }
  Store.patch(r.sala, p);
};
A.reabrir = () => {
  const r=S.r; if(!r) return;
  Store.patch(r.sala, {estado:"en_vivo", cerradaEn:null, secActiva: Math.max(0,(r.secciones||[]).length-1)});
};

// A quién va un mensaje según el canal abierto. Si un voluntario escribe en el canal
// de su propia área, le está hablando a producción (si no, se mandaría a sí mismo).
function destinoDe(canal){
  if(!canal || canal==="todos") return "todos";
  if(S.yo && !esProductor() && canal===S.yo.areaId) return "produccion";

}
A.enviar = (texto, para) => {

  Store.chat(r.sala, {
    nombre:S.yo.nombre, area:S.yo.areaId, deId:sesionId(),
    para: para||"todos", texto:texto.trim().slice(0,300), en: ahora()
  });
};
A.avisoPulpito = (texto) => {
  const r=S.r; if(!r) return;
  Store.patch(r.sala, {avisoPulpito: texto ? {texto, en: ahora()} : null});
};

function cProgreso(r, opts={}){
  const pre=progreso(r.pre), viv=progreso(r.vivo), pos=progreso(r.post);
  const críticos = listaChecks(r).filter(c=>c.critico && !c.hecho);
  const vencidos = (r.pre||[]).filter(c=>!c.hecho && estadoCheck(r,c,"pre")==="over").length
                 + (r.post||[]).filter(c=>!c.hecho && estadoCheck(r,c,"post")==="over").length;
  const d = desvio(r), nv = nivel(d);
  const enVivo = r.estado==="en_vivo";
  const faltan = r.inicioMs - ahora();

  const celda = (k,v,cls,pct,barcls) => `<div class="pcell">
      <span class="k">${k}</span>
      <span class="pv ${cls||''}" ${pct!=null?'':''}>${v}</span>
      ${pct!=null?`<span class="bar"><i class="${barcls||''}" style="width:${pct}%"></i></span>`:''}
    </div>`;

  return `<div class="pbar"><div class="pbar-in">
    ${celda("Pre reunión", `${pre.h} / ${pre.t}`, pre.pct===100?"ok":"", pre.pct, pre.pct===100?"ok":"")}
    ${celda("Durante",     `${viv.h} / ${viv.t}`, viv.pct===100?"ok":"", viv.pct, viv.pct===100?"ok":"")}
    ${celda("Post",        `${pos.h} / ${pos.t}`, pos.pct===100?"ok":"", pos.pct, pos.pct===100?"ok":"")}
    ${ enVivo
        ? celda("Desvío", `<span id="tk-desvio">${fmtDur(d,true)}</span>`, nv)
        : celda(faltan>0?"Falta para arrancar":"Hora de inicio",

                faltan>0 && faltan<15*60000 ? "warn":"") }
    ${celda("Vencidos", String(vencidos), vencidos?"late":"")}
    ${celda("Críticos", String(críticos.length), críticos.length?"late":"ok")}
  </div></div>`;
}

function cSecciones(r, opts={}){
  const h = horarios(r);
  let bloqueActual = null;
  const filas = (r.secciones||[]).map((sec,i)=>{
    const viva = r.secActiva===i && r.estado==="en_vivo";
    const pasada = r.secActiva!=null && i<r.secActiva;
    let dur;
    if(viva && sec.arrancoEn){
      const rest = sec.min*60000-(ahora()-sec.arrancoEn);
      dur = `<span id="tk-sec" style="${rest<0?'color:var(--late)':''}">${fmtDur(rest)}</span>`;
    } else if(sec.arrancoEn && sec.terminoEn){
      dur = fmtDur(sec.terminoEn-sec.arrancoEn)+" / "+sec.min+"′";
    } else dur = sec.min+"′";

    let cabecera = "";
    if(sec.bloque && sec.bloque!==bloqueActual){
      bloqueActual = sec.bloque;
      cabecera = `<div class="bloque">${esc(sec.bloque)}</div>`;
    }
    const control = opts.control && r.estado==="en_vivo" && !viva
      ? `<button class="btn gh sm" data-act="irsec" data-i="${i}" title="Saltar a esta sección">▸</button>` : "";

    return cabecera + `<div class="sec ${viva?'live':''} ${pasada?'past':''}">
      <span class="sh">${hhmm(h.inicios[i])}</span>
      <span class="st">${esc(sec.titulo)}
        ${sec.esPredica?'<span class="chip sig">púlpito</span>':''}
        ${sec.cat==="otro"?'<span class="chip">otro</span>':''}
        ${sec.notas?`<div class="muted" style="font-size:12.5px">${esc(sec.notas)}</div>`:''}
      </span>
      <span class="sd">${dur}${control}</span>
    </div>` + cCancionesSec(r, sec, i, viva, pasada);
  }).join("");
  return `<div class="card">
    <div class="phase"><span>Programa</span><span class="pc">fin objetivo ${hhmm(h.fin)}</span></div>
    ${filas || '<div class="empty">Sin secciones cargadas.</div>'}
  </div>`;
}

// Las canciones de un bloque de alabanza, debajo de la sección en el programa
function cCancionesSec(r, sec, i, viva, pasada){
  if(!esWorship(sec) || !(sec.canciones||[]).length) return "";
  return sec.canciones.map((c,j)=>{
    const on = viva && sec.canActiva===j && !c.terminoEn;
    const hecha = !!(c.arrancoEn && (c.terminoEn || (viva && sec.canActiva!==j) || pasada));
    let dur = "";
    if(on && c.arrancoEn) dur = `<span id="tk-song2">${fmtDur(ahora()-c.arrancoEn)}</span>${c.min?" / "+c.min+"′":""}`;
    else if(c.arrancoEn && c.terminoEn) dur = fmtDur(c.terminoEn-c.arrancoEn);
    else if(c.min) dur = c.min+"′";
    const btn = viva && marcaCanciones() && !on
      ? `<button class="btn gh sm" data-act="cancion" data-j="${j}" title="Empezó esta canción">▶</button>` : "";
    return `<div class="song ${on?'on':''} ${hecha&&!on?'past':''}">
      <span class="sn">♪ ${j+1}</span>
      <span>${esc(c.nombre)} <span class="sm">${esc(metaCancion(c))}</span></span>
      <span class="sm">${dur}${btn}</span>
    </div>`;
  }).join("");
}

// "Sigue: …" — si estamos en alabanza, la próxima canción con su tono, bpm y quién la canta
function textoSigue(r, next){
  const info = infoCanciones(r);
  if(info && info.sigue) return { titulo:"♪ "+info.sigue.nombre, meta: metaCancion(info.sigue) };
  if(!next) return null;
  let meta = next.min+"′";
  if(esWorship(next) && (next.canciones||[]).length) meta += " · ♪ "+next.canciones[0].nombre+(metaCancion(next.canciones[0])?" ("+metaCancion(next.canciones[0])+")":"");
  return { titulo: next.titulo, meta };
}

function cChat(r, opts={}){
  const todos = Object.entries(r.chat||{}).map(([k,v])=>({id:k,...v})).sort((a,b)=>(a.en||0)-(b.en||0));
  const canal = S.canal || "todos";

  const msgs = todos.filter(m=>enCanal(m,canal)).slice(-80);

  const visto = vistoDe(r.sala);
  const sinLeer = c => todos.filter(m => enCanal(m,c) && (m.en||0) > (visto[c]||0) && m.deId!==sesionId()).length;
  marcarVisto(r.sala, canal, ahora());

  const canalesSala = esProductor() ? DESTINOS_SALA : [];
  const rail = [{id:"todos",nombre:"TODOS",color:"var(--ink-2)"}, ...CFG.areas, ...canalesSala].map(a=>{
    const n = a.id===canal ? 0 : sinLeer(a.id);

  }).join("");

  const cuerpo = msgs.length ? msgs.map(m=>{
    const mio = m.deId===sesionId();
    const dirigido = m.para && m.para!=="todos";
    return `<div class="msg ${mio?'mine':''} ${dirigido?'dir':''}">
      <div class="mh">
        <span class="mn" style="color:${area(m.area).color}">${esc(m.nombre)}</span>
        ${dirigido?`<span class="mw">→ ${esc(area(m.para).nombre)}</span>`:''}
        <span class="mw">${m.en?hhmm(m.en):''}</span>
      </div>
      <div class="mb">${esc(m.texto)}</div>
    </div>`;
  }).join("") : '<div class="empty">Nada en este canal todavía.</div>';

  const destino = destinoDe(canal);
  const rapidos = CFG.rapidos.map(t=>`<button class="btn sm" data-act="rapido" data-t="${esc(t)}">${esc(t)}</button>`).join("");

  return `<div class="card chat" style="max-height:${opts.alto||'420px'}">
    <div class="phase"><span>Chat</span>
      <span class="pc">${destino==="todos"?"a todo el equipo":"a "+esc(area(destino).nombre)}</span></div>
    <div class="chat-body">
      <div class="chat-rail">${rail}</div>
      <div class="chat-main">
        <div class="msgs" id="msgs">${cuerpo}</div>
        ${opts.ro ? '' : `
          <div class="quick">${rapidos}</div>

            <input class="inp" id="chatTxt" data-para="${destino}" maxlength="300" autocomplete="off" value="${esc(S.borrador||"")}"
                   placeholder="${destino==="todos"?"A todos…":"A "+esc(area(destino).nombre)+"…"}">
            <button class="btn pri" data-act="enviar">↑</button>
          </div>`}
      </div>
    </div>
  </div>`;
}

/* ==========================================================================
   EDITOR DE SECCIONES — el mismo para el asistente de nueva reunión ("wiz"),
   para Editar una reunión ("reu") y para las plantillas de Config ("tpl").

function datalistCanciones(){

// hasta qué sección está bloqueada (ya pasó o está sonando). -1 = nada bloqueado.
function bloqueoReu(r){
  if(!r) return -1;
  if(r.estado==="cerrada") return Infinity;
  if(r.estado==="en_vivo") return r.secActiva==null ? -1 : r.secActiva;
  return -1;
}
function edSecs(t){
  if(t==="wiz") return S.wiz ? S.wiz.secciones : [];
  if(t==="tpl") return S.tplEdit ? S.tplEdit.secciones : [];
  if(t==="reu") return S.r ? (S.r.secciones||[]) : [];
  return [];
}
function edLock(t){ return t==="reu" ? bloqueoReu(S.r) : -1; }

        return `<div class="ed-song" data-row="song" data-lock="${lkS?1:0}">
          <span class="ed-drag ${lkS?'off':''}" data-drag="song" data-t="${t}" data-i="${i}" data-j="${j}" ${lkS?'':'tabindex="0" title="Arrastrá para cambiar el orden"'}>☰<span class="n">${j+1}</span></span>
          <input class="inp" ${ds} data-f="nombre" list="dlCanciones" value="${esc(c.nombre||"")}" placeholder="Canción ${j+1}" ${lkS?"disabled":""}>

      ${t==="reu"&&lock>=0&&lock!==Infinity?'<span class="muted" style="font-size:12px">Las que ya pasaron o están sonando no se pueden mover.</span>':''}
    </div>
  </div>`;
}

// ---- arrastrar y soltar con la manija ☰ (pointer events: mouse, dedo y lápiz)
var DRAG = { on:false };
async function moverFila(tipo, h, from, to){
  if(from===to) return;
  if(tipo==="cat"){
    const arr=catalogo(); const [x]=arr.splice(from,1); arr.splice(to,0,x);
    const o={}; arr.forEach((c,j)=>o[c.id]={...c,orden:j});
    await Store.setConfig("catalogo", o); return;
  }
  const t=h.dataset.t; const secs=copiaJSON(edSecs(t));
  if(tipo==="sec"){
    const lock=edLock(t); if(from<=lock || to<=lock) return;
    const [x]=secs.splice(from,1); secs.splice(to,0,x);
    return edGuardar(t, secs);
  }
  if(tipo==="song"){
    const cs=secs[+h.dataset.i].canciones||[]; const [x]=cs.splice(from,1); cs.splice(to,0,x);
    return edGuardar(t, secs);
  }
}
function filasDe(h){
  const row=h.closest("[data-row]");
  const rows=[...row.parentElement.children].filter(e=>e.dataset && e.dataset.row===row.dataset.row);
  let min=0; while(min<rows.length && rows[min].dataset.lock==="1") min++;   // no se puede soltar arriba de lo que ya pasó
  return {row, rows, from: rows.indexOf(row), min};
}
document.addEventListener("pointerdown", ev=>{
  const h=ev.target.closest(".ed-drag"); if(!h || h.classList.contains("off") || ev.button>0) return;
  ev.preventDefault();
  // si había un campo con foco, se guarda ANTES de mover: si no, al redibujar su texto
  // quedaría pegado en la fila que ocupe ese lugar
  DRAG.on = true;
  if(document.activeElement && document.activeElement!==document.body && document.activeElement.blur) document.activeElement.blur();
  const {row, rows, from, min} = filasDe(h);
  // la sección arrastra con ella su bloque de canciones
  const extra = row.nextElementSibling && row.nextElementSibling.classList.contains("ed-songs") && row.dataset.row==="sec" ? row.nextElementSibling : null;
  const linea=document.createElement("div"); linea.className="drag-linea"; document.body.appendChild(linea);
  Object.assign(DRAG, { on:true, pendiente:false, h, tipo:h.dataset.drag, row, extra, rows, from, to:from, min, y0:ev.clientY, sy0:window.scrollY, linea, id:ev.pointerId });
  try{ h.setPointerCapture(ev.pointerId); }catch(e){}
  [row,extra].forEach(e=>e&&e.classList.add("drag-on"));
  document.documentElement.classList.add("arrastrando");
  dragMover(ev.clientY);
});
function dragMover(y){
  const D=DRAG; const dy = y - D.y0 + (window.scrollY - D.sy0);
  [D.row,D.extra].forEach(e=>{ if(e) e.style.transform=`translateY(${dy}px)`; });
  const otras = D.rows.filter(r=>r!==D.row);
  let to = otras.filter(r=>{ const b=r.getBoundingClientRect(); return b.top+b.height/2 < y; }).length;
  to = Math.max(D.min, to); D.to = to;
  const ref = otras[to] ? otras[to].getBoundingClientRect() : null;
  const ult = otras[otras.length-1];
  const b = ref || (ult ? ult.getBoundingClientRect() : D.row.getBoundingClientRect());
  let top = ref ? b.top - 2 : b.bottom + 1;
  if(!ref && ult && D.tipo==="sec" && ult.nextElementSibling && ult.nextElementSibling.classList.contains("ed-songs")) top = ult.nextElementSibling.getBoundingClientRect().bottom + 1;
  Object.assign(D.linea.style, { top: top+"px", left: b.left+"px", width: b.width+"px", display: to===D.from ? "none" : "block" });
}
document.addEventListener("pointermove", ev=>{
  if(!DRAG.on || ev.pointerId!==DRAG.id) return;
  ev.preventDefault();
  // si se arrastra cerca del borde de la pantalla, la página se desplaza sola
  if(ev.clientY < 70) window.scrollBy(0,-14); else if(ev.clientY > window.innerHeight-70) window.scrollBy(0,14);
  dragMover(ev.clientY);
}, {passive:false});
async function dragFin(ev, cancelar){
  if(!DRAG.on || (ev && ev.pointerId!==DRAG.id)) return;
  const D={...DRAG}; DRAG.on=false;
  [D.row,D.extra].forEach(e=>{ if(e){ e.classList.remove("drag-on"); e.style.transform=""; } });
  D.linea.remove(); document.documentElement.classList.remove("arrastrando");
  if(!cancelar && D.to!==D.from) await moverFila(D.tipo, D.h, D.from, D.to);
  render();
}
document.addEventListener("pointerup", ev=>dragFin(ev,false));
document.addEventListener("pointercancel", ev=>dragFin(ev,true));
// con teclado: foco en la manija y flechas arriba/abajo
document.addEventListener("keydown", ev=>{
  const h=ev.target.closest && ev.target.closest(".ed-drag"); if(!h || h.classList.contains("off")) return;
  if(ev.key!=="ArrowUp" && ev.key!=="ArrowDown") return;
  ev.preventDefault();
  const {from, rows, min} = filasDe(h);
  const to = from + (ev.key==="ArrowUp"?-1:1);
  if(to<min || to>=rows.length) return;
  const sel = `.ed-drag[data-drag="${h.dataset.drag}"]${h.dataset.t?`[data-t="${h.dataset.t}"]`:""}${h.dataset.drag==="song"?`[data-i="${h.dataset.i}"][data-j="${to}"]`:`[data-i="${to}"]`}`;
  moverFila(h.dataset.drag, h, from, to).then(()=>setTimeout(()=>{ const n=document.querySelector(sel); if(n) n.focus(); }, 80));
});

// ---- cambios del editor
async function edGuardar(t, secs, extra){
  if(t==="wiz"){ S.wiz.secciones=secs; S.wiz.tocado=true; render(); return; }
  if(t==="tpl"){ S.tplEdit.secciones=secs; S.tplEdit.tocado=true; render(); return; }
  if(t==="reu"){ await Store.patch(S.r.sala, {secciones:secs, ...(extra||{})}); }
}
function nuevaSeccionPara(t, base){
  if(t==="reu") return {...base, id:"s"+uid(6), notas:"", arrancoEn:null, terminoEn:null, canActiva:null, canciones:[]};
  if(t==="tpl"){ const {canciones, ...resto} = base; return {...resto, canciones: base.esWorship?4:0}; }
  return base;
}
async function edAccion(act, b){
  const t=b.dataset.t; const i=+b.dataset.i; const j=+b.dataset.j;
  const secs = copiaJSON(edSecs(t)); const lock = edLock(t);
  if(act==="edmv"){
    const d=+b.dataset.d, k=i+d;
    if(k<0 || k>=secs.length || i<=lock || k<=lock) return;
    [secs[i],secs[k]]=[secs[k],secs[i]];
    return edGuardar(t, secs);
  }
  if(act==="eddel"){
    if(i<=lock) return;
    const s=secs[i];
    if(t==="reu"){
      const atados=(S.r.vivo||[]).filter(c=>c.secId===s.id);
      if(!confirm(`¿Sacar "${s.titulo}"?`+(atados.length?`\nSe van con ella ${atados.length} ítem(s) del checklist "durante".`:""))) return;
      secs.splice(i,1);
      return edGuardar(t, secs, {vivo:(S.r.vivo||[]).filter(c=>c.secId!==s.id)});
    }
    if(t==="tpl" && S.tplEdit){ S.tplEdit.vivo=(S.tplEdit.vivo||[]).filter(c=>c.secK!==s.k); }
    if(t==="wiz" && S.wiz){ S.wiz.vivo=(S.wiz.vivo||[]).filter(c=>c.secK!==s.k); }
    secs.splice(i,1);
    return edGuardar(t, secs);
  }
  if(act==="edadd"){
    const v=($("#edAdd-"+t)||{}).value; if(!v) return;
    let base;
    if(v==="otro"){ const n=prompt("Nombre de la sección"); if(!n||!n.trim()) return; base=seccionOtro(n.trim()); }
    else { const c=catDe(v); if(!c) return; base=seccionDesdeCat(c); }
    secs.push(nuevaSeccionPara(t, base));
    return edGuardar(t, secs);
  }
  if(act==="edsongadd"){
    const s=secs[i]; s.canciones=s.canciones||[];
    s.canciones.push(t==="reu" ? {...cancionVacia(), id:"t"+uid(6), arrancoEn:null, terminoEn:null} : cancionVacia());
    await edGuardar(t, secs);
    setTimeout(()=>{ const el=document.querySelector(`[data-edit="eds"][data-t="${t}"][data-i="${i}"][data-j="${s.canciones.length-1}"][data-f="nombre"]`); if(el) el.focus(); }, 60);
    return;
  }
  if(act==="edsongdel"){ secs[i].canciones.splice(j,1); return edGuardar(t, secs); }
  if(act==="edsongmv"){ const cs=secs[i].canciones; if(j<1) return; [cs[j-1],cs[j]]=[cs[j],cs[j-1]]; return edGuardar(t, secs); }
}
async function edCambio(el){
  const t=el.dataset.t, i=+el.dataset.i, f=el.dataset.f;
  const secs = copiaJSON(edSecs(t)); const s=secs[i]; if(!s) return;
  let val = el.value;
  if(el.dataset.edit==="ed"){
    if(f==="min") val=Math.max(1, parseInt(val,10)||1);
    if(f==="canciones") val=Math.max(0, Math.min(12, parseInt(val,10)||0));
    s[f]=val;
    return edGuardar(t, secs);
  }
  // canción
  const j=+el.dataset.j; const c=(s.canciones||[])[j]; if(!c) return;
  if(f==="nombre"){
    const v=val.trim();
    const lib = canciones().find(x=>etiquetaCancion(x)===v) || canciones().find(x=>clave(x.nombre)===clave(v));
    if(lib){
      c.cancionId=lib.id; c.nombre=lib.nombre; c.artista=lib.artista||"";
      if(!c.tono && lib.tono) c.tono=lib.tono;
      if(!c.bpm && lib.bpm) c.bpm=lib.bpm;
    } else { c.cancionId=null; c.nombre=v; c.artista=""; }
  } else if(f==="bpm" || f==="min"){ c[f] = val==="" ? "" : (parseInt(val,10)||""); }
  else c[f]=val;
  return edGuardar(t, secs);
}

// Las reglas de Firebase. Los DUEÑOS van escritos adentro (CFG.admins); los
// PRODUCTORES se leen de la base (config/productores), así que invitar o sacar uno
// NO requiere volver a copiar las reglas. Solo hay que copiarlas si cambian los dueños.
function reglasFirebase(){
  const mail = "auth.token.email.toLowerCase()";
  const ver  = "auth != null && auth.token.email_verified == true";
  const DUENO = CFG.admins.length
    ? `(${ver} && (${CFG.admins.map(m=>`${mail} == '${m.toLowerCase()}'`).join(" || ")}))`
    : "false";
  const clave = `${mail}.replace('.', ',')`;
  const PROD = `(${DUENO} || (${ver} && root.child('config/productores/' + ${clave}).exists()))`;
  const cod = "newData.child('codigo').val()";
  return JSON.stringify({
    rules: {
      salas: {
        ".read": PROD,
        ".indexOn": "inicioMs",
        "$sala": {
          ".read":  "auth != null",
          // cualquiera con el link marca checks y escribe en el chat; crear es de productores;
          // borrar: el dueño siempre, el productor solo si no está cerrada
          ".write": `auth != null && $sala.length >= 12 && ((data.exists() && newData.exists()) || (!data.exists() && ${PROD}) || (!newData.exists() && (${DUENO} || (${PROD} && data.child('estado').val() != 'cerrada'))))`
        }
      },
      activa: {
        ".read": "auth != null",
        "$alias": { ".write": PROD }
      },
      config: {
        ".read": PROD,
        plantillas: { ".write": DUENO },
        catalogo:   { ".write": DUENO },
        canciones:  { ".write": PROD },
        productores: {
          "$k": {
            ".read": `${ver} && $k == ${clave}`,
            // el dueño agrega o saca; un invitado se anota a sí mismo UNA vez, con una invitación válida
            // que se marca como usada en la misma operación
            ".write": `${DUENO} || (${ver} && $k == ${clave} && !data.exists() && newData.exists() && ${cod} != null && root.child('invitaciones/' + ${cod} + '/vence').val() > now && !root.child('invitaciones/' + ${cod} + '/usada').exists() && newData.parent().parent().parent().child('invitaciones/' + ${cod} + '/usada').val() == ${mail})`
          }
        }
      },
      invitaciones: {
        ".read": DUENO,
        "$cod": {
          ".read": "auth != null",
          ".write": DUENO,
          usada: { ".write": `${ver} && !data.exists() && newData.val() == ${mail} && root.child('invitaciones/' + $cod + '/vence').val() > now` }
        }
      }
    }
  }, null, 2);
}

// ---- importación de canciones (CSV de Servidores u otro, o directo de su Firestore)
function parseCSV(txt){
  const filas=[]; let f=[], c="", q=false;
  txt = txt.replace(/^﻿/,"");
  for(let i=0;i<txt.length;i++){
    const ch=txt[i];
    if(q){ if(ch==='"'){ if(txt[i+1]==='"'){ c+='"'; i++; } else q=false; } else c+=ch; continue; }
    if(ch==='"') q=true;
    else if(ch===","||ch===";"){ f.push(c); c=""; }
    else if(ch==="\n"){ f.push(c); filas.push(f); f=[]; c=""; }
    else if(ch!=="\r") c+=ch;
  }
  if(c!==""||f.length){ f.push(c); filas.push(f); }
  return filas.filter(r=>r.some(x=>x.trim()!==""));
}
const _TIPOS = {celebracion:"Celebración", guerra:"Guerra espiritual", guerraespiritual:"Guerra espiritual", exaltacion:"Exaltación", intimidad:"Intimidad"};
function soloTono(v){ const m=String(v||"").trim().match(/^([A-G](?:#|b)?m?)/); return m?m[1]:""; }
function tituloSiMayus(t){ t=String(t||"").trim(); return t && t===t.toUpperCase() && /[A-Z]/.test(t) ? t.toLowerCase().replace(/(^|\s)\S/g, x=>x.toUpperCase()) : t; }
function normalizarCancion(o){
  const nombre = tituloSiMayus(o.nombre); if(!nombre) return null;
  const artista = tituloSiMayus(o.artista);
  const mb = String(o.bpm||"").match(/(\d+(?:\.\d+)?)\s*(?:\((\d+\/\d+)\))?/);
  const tonoRaw = String(o.tono||"").trim();
  const tono = soloTono(tonoRaw);
  const voz = v => String(v||"").trim().toUpperCase()==="ORIGINAL" ? tono : soloTono(v);
  const d = { nombre, artista, tono, bpm: mb?Math.round(+mb[1]):null, compas: mb&&mb[2]?mb[2]:(o.compas||""),
    tpm:voz(o.tpm), tsm:voz(o.tsm), tph:voz(o.tph), tsh:voz(o.tsh),
    tipo: _TIPOS[clave(o.tipo)] || String(o.tipo||"").trim(), link: String(o.link||"").trim() };
  const rev=[]; if(tonoRaw && tonoRaw!==tono) rev.push(`tono "${tonoRaw}"`); if(!artista) rev.push("sin artista");
  if(rev.length) d.revisar = rev.join(", ");
  Object.keys(d).forEach(k=>{ if(d[k]===""||d[k]==null) delete d[k]; });
  return { id: (clave(nombre).slice(0,24)+"-"+clave(artista).slice(0,12)).replace(/-$/,""), d };
}
async function importarCanciones(lista){
  const actual = copiaJSON(cancionesObj()); let nuevas=0, act=0;
  lista.map(normalizarCancion).filter(Boolean).forEach(({id,d})=>{
    if(actual[id]){ actual[id] = {...actual[id], ...d}; act++; } else { actual[id]=d; nuevas++; }
  });
  await Store.setConfig("canciones", actual);
  toast(`${nuevas} nuevas · ${act} actualizadas`);
}
function filasCSVaCanciones(filas){
  const h = filas[0].map(x=>clave(x));
  const col = (...ns) => { for(const n of ns){ const i=h.indexOf(n); if(i>-1) return i; } return -1; };
  const ix = { nombre:col("cancion","nombre","titulo","song"), artista:col("artista","artist"), tipo:col("tipo"), bpm:col("bpm","tempo"),
    tono:col("tono","key"), tpm:col("tpm"), tsm:col("tsm"), tph:col("tph"), tsh:col("tsh"), link:col("link","url") };
  if(ix.nombre<0) throw new Error("El CSV no tiene una columna Cancion o Nombre");
  return filas.slice(1).map(f=>{ const o={}; Object.entries(ix).forEach(([k,i])=>{ if(i>-1) o[k]=f[i]; }); return o; });
}
function cargarScript(src){
  return new Promise((ok,mal)=>{ if(document.querySelector(`script[src="${src}"]`)) return ok();
    const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>mal(new Error("no cargó "+src)); document.head.appendChild(s); });
}

/* ==========================================================================
   ESTADÍSTICAS — #/estadisticas
   Se calcula todo en el navegador con las reuniones cerradas. Es por ÁREA, no por persona.
   ========================================================================== */
// Puntaje 0–100 de una reunión: 40% puntualidad de inicio, 20% de fin, 40% checklist a tiempo.
// Inicio: hasta 1′ tarde = 100, 10′ o más = 0. Fin: hasta 1′ = 100, 15′ o más = 0.
function puntajeReunion(r){
  const h = horarios(r);
  const esc01 = (ms, tope) => ms==null ? null : Math.max(0, Math.min(100, 100 - (Math.max(0,ms)/60000 - 1) * (100/(tope-1))));
  const pIni = esc01(r.arrancoEn ? r.arrancoEn - r.inicioMs : null, 10);
  const pFin = esc01(r.cerradaEn ? r.cerradaEn - h.fin : null, 15);
  const items = [...(r.pre||[]).map(c=>[c,"pre"]), ...(r.vivo||[]).map(c=>[c,"vivo"]), ...(r.post||[]).map(c=>[c,"post"])];
  const pChk = items.length ? items.filter(([c,f])=>c.hecho && !checkTarde(r,c,f)).length / items.length * 100 : null;
  const partes = [[pIni,.4],[pFin,.2],[pChk,.4]].filter(x=>x[0]!=null);
  if(!partes.length) return null;
  const peso = partes.reduce((a,x)=>a+x[1],0);
  return Math.round(partes.reduce((a,x)=>a+x[0]*x[1],0)/peso);
}
const clsPuntaje = p => p==null ? "" : p>=80 ? "ok" : p>=60 ? "warn" : "late";
function inicioSemana(iso){
  const [y,m,d]=iso.split("-").map(Number); const dt=new Date(y,m-1,d);
  const dif=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-dif);
  return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
}

function vEstadisticas(){
  if(!esProductor()) return vLanding();
  const F = S.est;
  if(!F.desde) F.desde = isoHoy(-90);
  if(!F.hasta) F.hasta = isoHoy(7);
  const rs = S.lista.filter(r=>r.estado==="cerrada" && r.fecha>=F.desde && r.fecha<=F.hasta && (!F.plantilla || r.plantilla===F.plantilla))
                    .sort((a,b)=>a.inicioMs-b.inicioMs);
  const filtros = `<div class="card" style="padding:12px 14px"><div class="filtros">
    <label class="f"><span>Desde</span><input class="inp" type="date" data-edit="est" data-f="desde" value="${F.desde}"></label>
    <label class="f"><span>Hasta</span><input class="inp" type="date" data-edit="est" data-f="hasta" value="${F.hasta}"></label>
    <label class="f"><span>Tipo de reunión</span><select class="inp" data-edit="est" data-f="plantilla">
      <option value="">Todas</option>${plantillas().map(p=>`<option value="${p.id}" ${p.id===F.plantilla?"selected":""}>${esc(p.nombre)}</option>`).join("")}</select></label>
    <label class="f"><span>Área</span><select class="inp" data-edit="est" data-f="area">
      <option value="">Todas</option>${CFG.areas.map(a=>`<option value="${a.id}" ${a.id===F.area?"selected":""}>${esc(a.nombre)}</option>`).join("")}</select></label>
  </div></div>`;
  const cab = cTopbar(`<a class="btn sm" href="#/">← Reuniones</a>`) + `<div class="main stack" style="gap:16px"><h1 style="font-size:26px">Estadísticas</h1>${filtros}`;
  if(!rs.length) return cab + `<div class="card"><div class="empty">No hay reuniones cerradas en ese rango.<br>Las estadísticas salen de las reuniones que se iniciaron y se cerraron desde la app.</div></div></div>`;

  // ---- puntualidad
  const puntajes = rs.map(puntajeReunion).filter(x=>x!=null);
  const dIni = rs.filter(r=>r.arrancoEn).map(r=>r.arrancoEn-r.inicioMs);
  const dFin = rs.filter(r=>r.cerradaEn).map(r=>r.cerradaEn-horarios(r).fin);
  const secsTodas = rs.flatMap(r=>(r.secciones||[]).filter(s=>s.arrancoEn&&s.terminoEn).map(s=>({r,s,real:s.terminoEn-s.arrancoEn,plan:(s.min||0)*60000})));
  const pasadas = secsTodas.filter(x=>x.real > x.plan + 60000).length;
  const pctOk = arr => arr.length ? Math.round(arr.filter(v=>v<=60000).length/arr.length*100) : null;
  const pP = prom(puntajes);
  const kpis = `<div class="kpis">
    <div><span class="k">Reuniones</span><b>${rs.length}</b><span class="muted" style="font-size:12px">cerradas en el rango</span></div>
    <div><span class="k">Puntaje promedio</span><b class="${clsPuntaje(pP)}">${pP==null?"—":Math.round(pP)}</b><span class="muted" style="font-size:12px">de 100</span></div>
    <div><span class="k">Inicio</span><b class="${dIni.length&&prom(dIni)>3*60000?'late':''}">${dIni.length?fmtDur(prom(dIni),true):"—"}</b><span class="muted" style="font-size:12px">${pctOk(dIni)??"—"}% arrancó a tiempo</span></div>
    <div><span class="k">Fin</span><b class="${dFin.length&&prom(dFin)>5*60000?'late':''}">${dFin.length?fmtDur(prom(dFin),true):"—"}</b><span class="muted" style="font-size:12px">${pctOk(dFin)??"—"}% terminó a tiempo</span></div>
    <div><span class="k">Secciones pasadas</span><b class="${secsTodas.length&&pasadas/secsTodas.length>.4?'warn':''}">${secsTodas.length?Math.round(pasadas/secsTodas.length*100)+"%":"—"}</b><span class="muted" style="font-size:12px">más de 1′ sobre lo previsto</span></div>
  </div>
  <div class="muted" style="font-size:12px">Puntaje: 40% hora de inicio, 20% hora de fin, 40% checklist cerrado a tiempo. Hasta 1′ de demora cuenta como a tiempo.</div>`;

  // ---- tendencia semanal
  const sem = {};
  rs.forEach(r=>{ const p=puntajeReunion(r); if(p==null) return; const k=inicioSemana(r.fecha); (sem[k]=sem[k]||[]).push(p); });
  const semanas = Object.keys(sem).sort();
  const tendencia = semanas.length>1 ? `<div class="card"><div class="phase"><span>Tendencia semanal · puntaje</span></div>
    <div class="tendencia">${semanas.map(k=>{ const v=Math.round(prom(sem[k])); const [y,m,d]=k.split("-");
      return `<div class="tb" title="Semana del ${d}/${m}: ${v}"><span>${v}</span><i style="height:${Math.max(4,v)}%;background:var(--${clsPuntaje(v)==='ok'?'ok':clsPuntaje(v)==='warn'?'warn':'late'})"></i><span>${d}/${m}</span></div>`; }).join("")}</div></div>` : "";

  // ---- checklist por área
  const items = rs.flatMap(r=>["pre","vivo","post"].flatMap(f=>(r[f]||[]).map(c=>({r,c,f,tarde:checkTarde(r,c,f)}))));
  const areas = CFG.areas.filter(a=>!F.area || a.id===F.area);
  const filasArea = areas.map(a=>{
    const it = items.filter(x=>x.c.area===a.id); if(!it.length) return "";
    const hechos = it.filter(x=>x.c.hecho), aT = hechos.filter(x=>!x.tarde), tar = hechos.filter(x=>x.tarde);
    const demora = prom(tar.map(x=>cuantoTarde(x.r,x.c,x.f)));
    const pH = Math.round(hechos.length/it.length*100), pT = Math.round(aT.length/it.length*100);
    return `<tr><td><span class="dot" style="color:${a.color};display:inline-block;margin-right:7px"></span>${esc(a.nombre)}</td>
      <td class="mono">${it.length}</td>
      <td class="mono ${pH>=95?'ok':pH>=80?'warn':'late'}">${pH}%</td>
      <td class="mono ${pT>=85?'ok':pT>=65?'warn':'late'}">${pT}%</td>
      <td class="mono">${demora!=null?fmtDur(demora):"—"}</td>
      <td class="mono ${it.length-hechos.length?'late':''}">${it.length-hechos.length}</td></tr>`;
  }).join("");
  // ítems que más fallan
  const grupos = {};
  items.filter(x=>!F.area || x.c.area===F.area).forEach(x=>{
    const k = x.c.area+"|"+clave(x.c.texto);
    const g = grupos[k] = grupos[k] || {texto:x.c.texto, area:x.c.area, n:0, sin:0, tarde:0};
    g.n++; if(!x.c.hecho) g.sin++; else if(x.tarde) g.tarde++;
  });
  const peores = Object.values(grupos).filter(g=>g.sin+g.tarde>0).sort((a,b)=>((b.sin+b.tarde)/b.n)-((a.sin+a.tarde)/a.n) || b.n-a.n).slice(0,10);

  // ---- secciones (por pieza del catálogo)
  const porCat = {}; const otros = [];
  secsTodas.forEach(x=>{ const id=catDeSeccion(x.s); if(id==="otro"){ otros.push(x); return; } (porCat[id]=porCat[id]||[]).push(x); });
  const filasCat = Object.entries(porCat).sort((a,b)=>b[1].length-a[1].length).map(([id,arr])=>{
    const reales=arr.map(x=>x.real), planes=arr.map(x=>x.plan); const dif=prom(reales)-prom(planes);
    return `<tr><td>${esc(nombreCat(id))}</td><td class="mono">${arr.length}</td><td class="mono">${fmtDur(prom(planes))}</td>
      <td class="mono">${fmtDur(prom(reales))}</td><td class="mono ${Math.abs(dif)<=60000?'ok':Math.abs(dif)<=3*60000?'warn':'late'}">${fmtDur(dif,true)}</td>
      <td class="mono">${fmtDur(Math.min(...reales))}</td><td class="mono">${fmtDur(Math.max(...reales))}</td></tr>`;
  }).join("");

  // ---- canciones
  const tocadas = rs.flatMap(r=>(r.secciones||[]).filter(esWorship).flatMap(s=>(s.canciones||[]).map((c,j)=>({c,j,dur: c.arrancoEn&&c.terminoEn ? c.terminoEn-c.arrancoEn : null})))).filter(x=>x.dur!=null && x.dur>20000);
  const porCan = {};
  tocadas.forEach(x=>{ const k=x.c.cancionId||clave(x.c.nombre); (porCan[k]=porCan[k]||{nombre:x.c.nombre, artista:x.c.artista, d:[]}).d.push(x.dur); });
  const filasCan = Object.values(porCan).sort((a,b)=>prom(b.d)-prom(a.d)).slice(0,40).map(g=>`<tr>
    <td>${esc(g.nombre)}${g.artista?` <span class="muted" style="font-size:12px">${esc(g.artista)}</span>`:""}</td>
    <td class="mono">${g.d.length}</td><td class="mono">${fmtDur(prom(g.d))}</td><td class="mono">${fmtDur(Math.min(...g.d))}</td><td class="mono">${fmtDur(Math.max(...g.d))}</td></tr>`).join("");
  const porPos = {}; tocadas.forEach(x=>{ (porPos[x.j]=porPos[x.j]||[]).push(x.dur); });
  const posiciones = Object.keys(porPos).map(Number).sort((a,b)=>a-b);

  const lista = rs.slice().reverse().map(r=>{ const p=puntajeReunion(r); return `<tr>
    <td class="mono">${r.fecha.split("-").reverse().join("/")}</td><td>${esc(r.titulo)}</td>
    <td class="mono ${clsPuntaje(p)}">${p??"—"}</td>
    <td class="mono">${r.arrancoEn?fmtDur(r.arrancoEn-r.inicioMs,true):"—"}</td>
    <td class="mono">${r.cerradaEn?fmtDur(r.cerradaEn-horarios(r).fin,true):"—"}</td>
    <td><a class="btn gh sm" href="#/reporte/${r.sala}">Reporte →</a></td></tr>`; }).join("");

  const tabla = (titulo, cols, filas, pie) => `<div class="card"><div class="phase"><span>${titulo}</span></div>
    <div class="tbl-scroll"><table class="rep" style="min-width:0"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead>
    <tbody>${filas || `<tr><td colspan="${cols.length}" class="empty">Sin datos todavía.</td></tr>`}</tbody></table></div>
    ${pie?`<div class="muted" style="padding:9px 12px;font-size:12.5px;border-top:1px solid var(--line)">${pie}</div>`:""}</div>`;

  return cab + kpis + tendencia
    + tabla("Checklist por área", ["Área","Ítems","Hechos","A tiempo","Demora prom. (tarde)","Sin cerrar"], filasArea,
            "A tiempo = marcado antes de su hora (antes/después) o antes de que termine su sección (durante).")
    + tabla("Ítems que más fallan", ["Ítem","Área","Veces","Sin cerrar","Tarde"],
            peores.map(g=>`<tr><td>${esc(g.texto)}</td><td><span style="color:${area(g.area).color}">${esc(area(g.area).nombre)}</span></td><td class="mono">${g.n}</td><td class="mono ${g.sin?'late':''}">${g.sin}</td><td class="mono ${g.tarde?'warn':''}">${g.tarde}</td></tr>`).join(""),
            "Si un ítem falla siempre, probablemente está mal escrito, mal asignado o a una hora imposible: ajustalo en la plantilla.")
    + tabla("Secciones · cuánto duran", ["Sección","Veces","Previsto prom.","Real prom.","Diferencia","Mín.","Máx."], filasCat,
            otros.length?`${otros.length} sección(es) cargadas como <b>Otro</b> no entran en los promedios: ${[...new Set(otros.map(x=>x.s.titulo))].slice(0,8).map(esc).join(", ")}.`:"")
    + tabla("Canciones · cuánto duran", ["Canción","Veces","Promedio","Mín.","Máx."], filasCan,
            tocadas.length?"Sale de los toques en <b>▶ Empezó esta canción</b> (Pantalla o producción).":"Todavía no hay canciones marcadas. Pantalla o el productor tocan <b>▶ Empezó</b> en cada canción durante la alabanza.")
    + (posiciones.length?tabla("Canciones · por posición en el bloque", ["Posición","Veces","Duración promedio"],
            posiciones.map(j=>`<tr><td>${j+1}ª canción</td><td class="mono">${porPos[j].length}</td><td class="mono">${fmtDur(prom(porPos[j]))}</td></tr>`).join("")):"")
    + tabla("Reuniones", ["Fecha","Reunión","Puntaje","Inicio","Fin",""], lista)
    + `</div>`;
}
