function vAdmin(){
  const rs = S.lista;
  const linkeada = rs.find(r=>r.sala===S.activa) || null;
  const enVivo   = rs.filter(r=>r.estado==="en_vivo").sort((a,b)=>a.inicioMs-b.inicioMs);
  const proximas = rs.filter(r=>r.estado!=="en_vivo" && !esPasada(r)).sort((a,b)=>a.inicioMs-b.inicioMs);
  const pasadas  = rs.filter(r=>r.estado!=="en_vivo" && esPasada(r)).sort((a,b)=>b.inicioMs-a.inicioMs);
  // dos o más reuniones a la misma fecha y hora: casi seguro un duplicado por error
  const cuenta = {}; rs.forEach(r=>{ const k=r.fecha+" "+r.hora; cuenta[k]=(cuenta[k]||0)+1; });

  const fila = (r, pasada) => {
    const p = progreso(listaChecks(r));
    const badge = {en_vivo:'<span class="chip crit"><span class="dot"></span>en vivo</span>', cerrada:'<span class="chip">cerrada</span>'}[r.estado]
               || (pasada?'<span class="chip">no se hizo</span>':'');
    const linked = S.activa===r.sala;
    const dup = cuenta[r.fecha+" "+r.hora]>1 && !pasada;
    const puedeBorrar = esDueno() || r.estado!=="cerrada";
    return `<div class="linkrow ${pasada?'pasada':''}" style="gap:12px">
      <div class="grow col" style="gap:2px">
        <div class="row wrap" style="gap:8px"><b>${esc(r.titulo)}</b>${badge}
          ${linked?'<span class="chip link" title="Los links permanentes del equipo apuntan a esta reunión">🔗 en los links</span>':''}
          ${dup?'<span class="chip warn" title="Hay otra reunión a la misma fecha y hora">¿duplicada?</span>':''}</div>
        <span class="lu">${fechaLarga(r.fecha)} · ${r.hora} · ${p.h}/${p.t} completado</span>
      </div>
      ${linked||pasada?'':`<button class="btn sm" data-act="activar" data-sala="${r.sala}" title="Que los links permanentes del equipo apunten a esta reunión">🔗 Poner en los links</button>`}
      ${pasada?'':`<button class="btn sm pri" data-act="consola" data-sala="${r.sala}">Consola</button>
      <button class="btn sm" data-act="abrir" data-sala="${r.sala}">Tablet</button>`}
      <button class="btn sm" data-act="editar" data-sala="${r.sala}">Editar</button>
      ${pasada?'':`<button class="btn sm" data-act="links" data-sala="${r.sala}">Links</button>`}
      ${r.estado==="cerrada"||r.estado==="en_vivo"?`<a class="btn sm" href="#/reporte/${r.sala}">Reporte</a>`:""}
      ${puedeBorrar?`<button class="btn gh sm danger" data-act="borrar" data-sala="${r.sala}" title="Borrar">✕</button>`:""}
    </div>`;
  };

  // aviso: los links apuntan a una reunión que ya terminó
  const siguiente = proximas[0] || null;
  let avisoLinks = "";
  if(linkeada && esPasada(linkeada)){
    avisoLinks = `<div class="warnbox row wrap" style="gap:10px">
      <span class="grow">Los links del equipo apuntan a <b>${esc(linkeada.titulo)}</b> (${fechaLarga(linkeada.fecha)}), que ya terminó.</span>
      ${siguiente?`<button class="btn sm pri" data-act="activar" data-sala="${siguiente.sala}">Pasarlos a ${esc(siguiente.titulo)} · ${fechaLarga(siguiente.fecha)}</button>`:'<span>Creá la próxima y se pasan solos.</span>'}
    </div>`;
  } else if(!S.activa && siguiente){
    avisoLinks = `<div class="warnbox row wrap" style="gap:10px"><span class="grow">Los links del equipo no apuntan a ninguna reunión.</span>
      <button class="btn sm pri" data-act="activar" data-sala="${siguiente.sala}">Ponerlos en ${esc(siguiente.titulo)}</button></div>`;
  }

  const verTodas = S.verPasadas || pasadas.length<=8;
  const ultimaParaDuplicar = rs.slice().sort((a,b)=>b.inicioMs-a.inicioMs)[0];

  return cTopbar() + `<div class="main stack" style="gap:20px">
    <div class="row wrap" style="gap:8px">
      <a class="btn pri" href="#/nueva">+ Nueva reunión</a>
      ${ultimaParaDuplicar?`<button class="btn" data-act="duplicar" data-sala="${ultimaParaDuplicar.sala}" title="Copia la última reunión (orden, setlist y checklist) a otra fecha">Duplicar la última</button>`:""}
      <div class="grow"></div>
      <a class="btn" href="#/estadisticas">📊 Estadísticas</a>
      <a class="btn" href="#/config">⚙ Config</a>
      <button class="btn" data-act="cartel">Cartel de links</button>
    </div>
    ${avisoLinks}
    <div class="card">
      ${enVivo.length?`<div class="grupo-k">En vivo</div>${enVivo.map(r=>fila(r,false)).join("")}`:""}
      <div class="grupo-k">Próximas · ${proximas.length}</div>
      ${proximas.length?proximas.map(r=>fila(r,false)).join(""):'<div class="empty" style="padding:20px">No hay reuniones próximas. Creá una con <b>+ Nueva reunión</b>.</div>'}
      ${pasadas.length?`<div class="grupo-k">Pasadas · ${pasadas.length}</div>
        ${(verTodas?pasadas:pasadas.slice(0,8)).map(r=>fila(r,true)).join("")}
        ${verTodas?"":`<div style="padding:10px 12px"><button class="btn sm" data-act="verpasadas">Ver las ${pasadas.length} pasadas</button></div>`}`:""}
    </div>
    ${Store.modo==="demo" ? `<div class="warnbox">
      <b>Modo demo.</b> Los datos viven en este navegador y se sincronizan entre pestañas de esta misma computadora.
      Para que funcione entre celulares, pegá tu configuración de Firebase en el bloque <code>CFG.firebase</code> del archivo.
    </div>`:""}
  </div>`;
}

// ---- Nueva reunión: tipo, fecha y hora → orden → setlist → crear
function vNueva(){
  if(!esProductor()) return vLanding();
  const pls = plantillas();
  if(!S.wiz){
    const pl = pls[0] || PLANTILLAS_DEF[0];
    S.wiz = borradorDePlantilla(pl, proximoDomingo(), "10:00");
  }
  const w = S.wiz;
  const dups = S.lista.filter(r=>r.fecha===w.fecha && r.hora===w.hora);
  const fin = epochDe(w.fecha, w.hora) + w.secciones.reduce((a,s)=>a+(+s.min||0),0)*60000;
  const worship = w.secciones.filter(esWorship);
  const nV = (w.vivo||[]).filter(c=>w.secciones.some(s=>s.k===c.secK)).length;
  return cTopbar(`<a class="btn sm" href="#/">← Reuniones</a>`) + `<div class="main stack" style="gap:16px;max-width:1000px">
    <h1 style="font-size:26px">Nueva reunión</h1>
    <div class="card" style="padding:16px">
      <div class="k" style="margin-bottom:10px">1 · Tipo, fecha y hora</div>
      <div class="row wrap" style="gap:10px;align-items:flex-end">
        <label class="f grow" style="min-width:170px"><span>Tipo de reunión</span>
          <select class="inp" data-edit="wizr" data-f="plantilla">
            ${pls.map(p=>`<option value="${p.id}" ${p.id===w.plantilla?"selected":""}>${esc(p.nombre)}</option>`).join("")}
          </select></label>
        <label class="f" style="min-width:140px"><span>Fecha</span>
          <input class="inp" type="date" data-edit="wizr" data-f="fecha" value="${w.fecha}"></label>
        <label class="f" style="min-width:100px"><span>Hora</span>
          <input class="inp" type="time" data-edit="wizr" data-f="hora" value="${w.hora}"></label>
        <label class="f grow" style="min-width:170px"><span>Título (opcional)</span>
          <input class="inp" data-edit="wizr" data-f="titulo" value="${esc(w.titulo||"")}" placeholder="${esc((pls.find(p=>p.id===w.plantilla)||{}).nombre||"")}"></label>
      </div>
      ${dups.length?`<div class="warnbox" style="margin-top:10px">Ya hay ${dups.length>1?dups.length+" reuniones":"una reunión"} el ${fechaLarga(w.fecha)} a las ${w.hora}: <b>${dups.map(d=>esc(d.titulo)).join(", ")}</b>. ¿Seguro que querés crear otra?</div>`:""}
    </div>
    <div>
      <div class="k" style="margin:0 0 8px">2 · Revisá el orden — mové, sacá o agregá secciones y ajustá los minutos</div>
      ${cEditorSecciones("wiz")}
      <div class="muted" style="font-size:13px;margin-top:6px">Termina a las <b class="mono">${hhmm(fin)}</b>.
        Los ítems del checklist "durante" van con su sección: si la sacás, se van con ella.</div>
    </div>
    <div>
      <div class="k" style="margin:0 0 8px">3 · Setlist</div>
      ${worship.length
        ? `<div class="muted" style="font-size:13px">Las canciones se cargan dentro de ${worship.length>1?"cada bloque":"el bloque"} de alabanza, arriba. Escribí el nombre y elegí de la lista: el tono y el BPM se completan solos y los podés cambiar para esta reunión.</div>`
        : `<div class="muted" style="font-size:13px">Este orden no tiene bloque de alabanza. Si lo necesitás, agregá la sección "Alabanza".</div>`}
    </div>
    <div class="card" style="padding:14px 16px">
      <div class="k" style="margin-bottom:6px">4 · Checklist</div>
      <div style="font-size:14px">${(w.pre||[]).length} ítems antes · ${nV} durante · ${(w.post||[]).length} después, de la plantilla.
        <span class="muted">Si hace falta tocar alguno puntual, se hace después desde <b>Editar</b>.</span></div>
    </div>
    <div class="row" style="gap:8px">
      <button class="btn pri lg" data-act="wizcrear">Crear reunión</button>
      <button class="btn" data-act="wizreset">Volver a la plantilla</button>
    </div>
    ${datalistCanciones()}
  </div>`;

function vEditar(){

function vReporte(){
  const r=S.r; if(!r) return cTopbar()+cSinReunion();
  const h = horarios(r); const secs = r.secciones||[];
  const cerrada = r.estado==="cerrada";
  const finReal = r.cerradaEn || null;

  // --- secciones: planificado vs real
  const filasSec = secs.map((sec,i)=>{
    const plan = (sec.min||0)*60000;
    const real = sec.arrancoEn && sec.terminoEn ? sec.terminoEn-sec.arrancoEn : null;
    const dif  = real!=null ? real-plan : null;
    const arrDesv = sec.arrancoEn ? sec.arrancoEn - h.inicios[i] : null;
    const cls = v => v==null ? "" : Math.abs(v)<=60000 ? "ok" : Math.abs(v)<=3*60000 ? "warn" : "late";
    return `<tr>
      <td>${esc(sec.titulo)}${sec.bloque?`<span class="chip" style="margin-left:8px">${esc(sec.bloque)}</span>`:""}${sec.cat==="otro"?`<span class="chip warn" style="margin-left:6px" title="Cargada como Otro: no entra en los promedios">otro</span>`:""}</td>
      <td class="mono">${hhmm(h.inicios[i])}</td>
      <td class="mono">${sec.arrancoEn?hhmm(sec.arrancoEn):"—"}</td>
      <td class="mono ${cls(arrDesv)}">${arrDesv!=null?fmtDur(arrDesv,true):"—"}</td>
      <td class="mono">${sec.min}′</td>
      <td class="mono">${real!=null?fmtDur(real):"—"}</td>
      <td class="mono ${cls(dif)}">${dif!=null?fmtDur(dif,true):"—"}</td>
    </tr>`;
  }).join("");

  // --- checklist: sin cerrar y cerrados tarde
  const fases = [["pre","Pre reunión"],["vivo","Durante"],["post","Post reunión"]];
  const tarde = (c,fase) => {
    if(!c.hecho || !c.en) return false;
    if(fase==="vivo"){ const sec=secs.find(x=>x.id===c.secId); return !!(sec && sec.terminoEn && c.en > sec.terminoEn); }
    const t = horaCheck(r,c,fase); return t!=null && c.en > t + 60000;   // 1 minuto de tolerancia
  };
  const cuantoTarde = (c,fase) => {
    if(fase==="vivo"){ const sec=secs.find(x=>x.id===c.secId); return sec&&sec.terminoEn ? c.en-sec.terminoEn : 0; }
    return c.en - horaCheck(r,c,fase);
  };
  const bloques = fases.map(([f,nombre])=>{
    const arr = r[f]||[]; const p = progreso(arr);
    const sin = arr.filter(c=>!c.hecho);
    const tar = arr.filter(c=>tarde(c,f));
    return `<div class="card">
      <div class="phase"><span>${nombre}</span><span class="pc">${p.h} de ${p.t} · ${tar.length} tarde · ${sin.length} sin cerrar</span></div>
      ${sin.map(c=>`<div class="it ro over" style="grid-template-columns:auto 1fr auto">
          <span class="box"></span><span class="tx">${esc(c.texto)} ${c.critico?'<span class="chip crit">crítico</span>':''}
          <span class="chip" style="color:${area(c.area).color}">${esc(area(c.area).nombre)}</span></span>
          <span class="mt">sin cerrar</span></div>`).join("")}
      ${tar.map(c=>`<div class="it ro done" style="grid-template-columns:auto 1fr auto">
          <span class="box"></span><span class="tx">${esc(c.texto)}
          <span class="chip" style="color:${area(c.area).color}">${esc(area(c.area).nombre)}</span></span>
          <span class="mt" style="color:var(--warn)">${esc(c.por||"—")} · ${fmtDur(cuantoTarde(c,f))} tarde</span></div>`).join("")}
      ${!sin.length && !tar.length ? '<div class="empty" style="padding:14px">Todo cerrado a tiempo.</div>' : ''}
    </div>`;
  }).join("");

  const dur = r.arrancoEn && finReal ? finReal - r.arrancoEn : null;
  const durPlan = h.fin - r.inicioMs;
  // setlist: lo que se planeó y cuánto duró cada canción
  const bloquesW = secs.filter(s=>esWorship(s) && (s.canciones||[]).length);
  const setlist = bloquesW.map(s=>`<div class="card">
      <div class="phase"><span>Setlist · ${esc(s.titulo)}</span><span class="pc">bloque ${s.arrancoEn&&s.terminoEn?fmtDur(s.terminoEn-s.arrancoEn):"—"} / ${s.min}′</span></div>
      <div class="tbl-scroll"><table class="rep" style="min-width:0">
        <thead><tr><th>#</th><th>Canción</th><th>Tono</th><th>BPM</th><th>Canta</th><th>Duró</th></tr></thead>
        <tbody>${s.canciones.map((c,j)=>`<tr><td class="mono">${j+1}</td><td>${esc(c.nombre)}${c.artista?` <span class="muted" style="font-size:12px">${esc(c.artista)}</span>`:""}</td>
          <td class="mono">${esc(c.tono||"—")}</td><td class="mono">${c.bpm||"—"}</td><td>${esc(c.cantante||"—")}</td>
          <td class="mono">${c.arrancoEn&&c.terminoEn?fmtDur(c.terminoEn-c.arrancoEn)+(c.min?` / ${c.min}′`:""):"—"}</td></tr>`).join("")}</tbody>
      </table></div></div>`).join("");
  const otros = secs.filter(s=>s.cat==="otro");

  return cTopbar(`<a class="btn sm" href="#/">Admin</a>${esProductor()?`<a class="btn sm" href="#/estadisticas">📊 Estadísticas</a>`:""}<button class="btn sm no-print" onclick="window.print()">Imprimir</button>`) + `<div class="main stack" style="gap:18px">
    <div>
      <div class="k">Reporte de la reunión</div>
      <h1 style="font-size:28px;margin-top:4px">${esc(r.titulo)}</h1>
      <p class="muted" style="font-size:14px">${fechaLarga(r.fecha)} ${cerrada?"":"· <b>todavía no está cerrada</b>, el reporte es parcial"}</p>
    </div>
    <div class="cons-kpi tres" style="border:1px solid var(--line);border-radius:var(--r);overflow:hidden">
      <div><span class="k">Inicio</span><b class="mono">${r.arrancoEn?hhmm(r.arrancoEn):"—"}</b><span class="muted" style="font-size:12px">previsto ${r.hora}${r.arrancoEn?` · ${fmtDur(r.arrancoEn-r.inicioMs,true)}`:""}</span></div>
      <div><span class="k">Fin</span><b class="mono">${finReal?hhmm(finReal):"—"}</b><span class="muted" style="font-size:12px">previsto ${hhmm(h.fin)}${finReal?` · ${fmtDur(finReal-h.fin,true)}`:""}</span></div>
      <div><span class="k">Duración</span><b class="mono">${dur!=null?fmtDur(dur):"—"}</b><span class="muted" style="font-size:12px">prevista ${fmtDur(durPlan)}</span></div>
    </div>
    <div class="card">
      <div class="phase"><span>Secciones · planificado vs real</span></div>
      <div class="tbl-scroll"><table class="rep">
        <thead><tr><th>Sección</th><th>Previsto</th><th>Arrancó</th><th>Desvío</th><th>Duración</th><th>Real</th><th>Diferencia</th></tr></thead>
        <tbody>${filasSec || '<tr><td colspan="7" class="empty">Sin secciones.</td></tr>'}</tbody>
      </table></div>
      ${otros.length?`<div class="muted" style="padding:9px 12px;font-size:12.5px;border-top:1px solid var(--line)">Cargadas como <b>Otro</b> (no entran en los promedios): ${otros.map(s=>esc(s.titulo)).join(", ")}.</div>`:""}
    </div>
    ${setlist}
    ${bloques}
    ${r.notas?`<div class="card"><div class="phase"><span>Notas del productor</span></div>
      <div style="padding:12px 14px;font-size:14px;white-space:pre-wrap;color:var(--ink-2)">${esc(r.notas)}</div></div>`:""}
    <div class="muted" style="font-size:13px;max-width:60ch">Lo que quedó sin cerrar o se cerró tarde no es una falla del equipo: es la señal de qué ítems están mal escritos, mal asignados o sobran. Usalo para ajustar la plantilla antes del domingo que viene.</div>
  </div>`;
}

/* ==========================================================================
   OÍDO — escucha el canal del MD en la compu de sonido y avisa cuando llaman
   ========================================================================== */
// Cada regla: si en la frase aparece alguna de sus palabras, le avisa a su área.
// Una misma frase puede disparar varias ("sonido y video, atentos").
const REGLAS_DEF = [
  { destino:"sonido",     palabras:"sonido, audio, operador, técnico, foh" },
  { destino:"video",      palabras:"video, cámara, cámaras, transmisión, stream" },
  { destino:"pantalla",   palabras:"pantalla, letras, proyección, diapositiva" },
  { destino:"produccion", palabras:"producción, productor" }
].filter(r=>CFG.areas.find(a=>a.id===r.destino));
const OIDO_DEF = { deviceId:"", deviceLabel:"", canal:0, umbralDb:-45 };
function oidoCfg(){
  let c; try{ c = {...OIDO_DEF, ...JSON.parse(localStorage.getItem("cabina.oido")||"{}")}; }catch(e){ c = {...OIDO_DEF}; }
  if(!Array.isArray(c.reglas)){
    // versión anterior: una sola lista de palabras para un solo destino
    c.reglas = c.palabras ? [{destino:c.destino||"sonido", palabras:c.palabras}].concat(REGLAS_DEF.filter(r=>r.destino!==(c.destino||"sonido")))
                          : REGLAS_DEF.map(r=>({...r}));
    delete c.palabras; delete c.destino;
  }
  return c;
}
function oidoGuardar(c){ try{ localStorage.setItem("cabina.oido", JSON.stringify(c)); }catch(e){} }

// sin tildes, minúsculas, sin signos: "¡Sonido!" y "sonidó" matchean "sonido"
function normalizar(t){
  return String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9ñ ]+/g," ").replace(/\s+/g," ").trim();
}
function buscarPalabra(texto, palabras){
  const t = " "+normalizar(texto)+" ";
  const lista = String(palabras||"").split(",").map(normalizar).filter(Boolean);
  return lista.find(p => t.includes(" "+p+" ")) || null;
}

const OIDO = {
  activo:false, ctx:null, stream:null, analizadores:[], nCanales:0, rec:null, raf:0,
  hablando:false, sobreDesde:0, bajoDesde:0, parcial:"", finales:[], disparado:{},
  ultimoAviso:{}, ultimoEnvioTexto:0, latidoTimer:null, error:"", dispositivos:[],
  soportaTrack: true
};
// Quién ve el acceso al Oído: el área que recibe los avisos y el productor
function veOido(){ const c=oidoCfg(); return !!(S.yo && (S.yo.admin || c.reglas.some(r=>r.destino===S.yo.areaId))); }
function oidoActivo(r){ return !!(r && r.oido && r.oido.activo && ahora()-(r.oido.latido||0) < 15000); }

function cOidoBanner(r){
  if(!oidoActivo(r)) return "";
  const conTexto = r.oido.textoEn && ahora()-r.oido.textoEn < 5000;
  if(!r.oido.hablando && !conTexto) return "";
  return `<div class="oido-banner"><span class="dot"></span><span class="ob-k">EL MD ESTÁ HABLANDO</span>
    <span class="ob-t">${esc(r.oido.texto||"…")}</span></div>`;
}

function oidoPatch(obj){
  const r=S.r; if(!r) return;
  const p={}; Object.keys(obj).forEach(k=>p["oido/"+k]=obj[k]);
  Store.patch(r.sala, p);
}

async function oidoListarDispositivos(){
  try{
    const ds = await navigator.mediaDevices.enumerateDevices();
    OIDO.dispositivos = ds.filter(d=>d.kind==="audioinput");
  }catch(e){ OIDO.dispositivos=[]; }
  render();
}

async function oidoIniciar(){
  const c = oidoCfg();
  OIDO.error="";
  try{
    OIDO.stream = await navigator.mediaDevices.getUserMedia({ audio:{
      deviceId: c.deviceId ? {exact:c.deviceId} : undefined,
      channelCount: {ideal: 64},
      echoCancellation:false, noiseSuppression:false, autoGainControl:false
    }});
  }catch(e){
    OIDO.error = /NotAllowed|Permission/i.test(e.name||"") ? "Chrome no tiene permiso para usar el micrófono. Tocá el candado de la barra de direcciones y permitilo."
               : /NotFound|Overconstrained/i.test(e.name||"") ? "No encuentro esa interfaz de audio. ¿Está conectada la WING? Elegila de nuevo en la lista."
               : "No pude abrir la entrada de audio.";
    render(); return;
  }
  await oidoListarDispositivos();   // con permiso ya aparecen los nombres
  const track = OIDO.stream.getAudioTracks()[0];
  const st = track.getSettings ? track.getSettings() : {};
  if(st.deviceId && st.deviceId!==c.deviceId){ c.deviceId=st.deviceId; }
  c.deviceLabel = track.label || c.deviceLabel; oidoGuardar(c);
  track.onended = ()=>{ OIDO.error="Se desconectó la interfaz de audio."; oidoDetener(true); };

  OIDO.ctx = new (window.AudioContext||window.webkitAudioContext)();
  try{ await OIDO.ctx.resume(); }catch(e){}
  const src = OIDO.ctx.createMediaStreamSource(OIDO.stream);
  const n = Math.max(1, st.channelCount || src.channelCount || 1);
  OIDO.nCanales = n;
  const split = OIDO.ctx.createChannelSplitter(n);
  src.connect(split);
  OIDO.analizadores = [];
  for(let i=0;i<n;i++){
    const an = OIDO.ctx.createAnalyser(); an.fftSize = 1024;
    split.connect(an, i);
    OIDO.analizadores.push(an);
  }
  if(c.canal >= n){ c.canal = 0; oidoGuardar(c); }
  // el canal elegido va solo al reconocedor de voz
  OIDO.split = split;
  OIDO.destino = OIDO.ctx.createMediaStreamDestination();
  OIDO.ganancia = OIDO.ctx.createGain();
  OIDO.ganancia.connect(OIDO.destino);
  split.connect(OIDO.ganancia, c.canal);

  OIDO.activo = true;
  oidoReconocer();
  OIDO.raf = requestAnimationFrame(oidoMedir);
  oidoPatch({activo:true, latido:ahora(), hablando:false, texto:"", operador: S.yo?S.yo.nombre:""});
  clearInterval(OIDO.latidoTimer);
  OIDO.latidoTimer = setInterval(()=>oidoPatch({latido:ahora()}), 5000);
  render();
}

function oidoCambiarCanal(i){
  const c=oidoCfg(); c.canal=i; oidoGuardar(c);
  if(OIDO.activo && OIDO.split){
    try{ OIDO.split.disconnect(OIDO.ganancia); }catch(e){}
    // reconectar todas las salidas a sus analizadores y la elegida a la ganancia
    try{ OIDO.split.disconnect(); }catch(e){}
    OIDO.analizadores.forEach((an,k)=>OIDO.split.connect(an,k));
    OIDO.split.connect(OIDO.ganancia, i);
  }
  render();
}

function oidoReconocer(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ OIDO.error = "Este navegador no tiene reconocimiento de voz. Abrí esta pestaña en Google Chrome."; render(); return; }
  const rec = new SR();
  rec.lang = "es-AR"; rec.continuous = true; rec.interimResults = true;
  rec.onresult = ev => {
    if(OIDO.fallos || OIDO.error){ OIDO.fallos=0; if(OIDO.error){ OIDO.error=""; render(); } }   // volvió a andar
    let parcial="", final="";
    for(let k=ev.resultIndex;k<ev.results.length;k++){
      const t = ev.results[k][0].transcript;
      if(ev.results[k].isFinal) final += t; else parcial += t;
    }
    if(final) oidoFrase(final, true);
    if(parcial) oidoFrase(parcial, false);
  };
  rec.onresult_ok = false;
  rec.onerror = e => {
    if(e.error==="no-speech" || e.error==="aborted") return;
    const msg = e.error==="network" ? "Sin internet: el reconocimiento de voz de Chrome necesita conexión. Reintenta solo."
              : e.error==="not-allowed" ? "Chrome no tiene permiso para usar el micrófono."
              : e.error==="audio-capture" ? "No llega audio de la interfaz."
              : "El reconocimiento de voz se cortó. Se vuelve a conectar solo.";
    OIDO.fallos = (OIDO.fallos||0) + 1;
    if(msg!==OIDO.error){ OIDO.error = msg; render(); }   // solo re-dibuja si cambió el mensaje
  };
  // Chrome corta el reconocimiento cada tanto: si seguimos escuchando, lo relanzamos.
  // Si viene fallando (sin internet), espera cada vez más: 0,3 s → hasta 15 s.
  rec.onend = () => {
    if(!OIDO.activo) return;
    const espera = OIDO.fallos ? Math.min(15000, 1000*Math.pow(2, OIDO.fallos-1)) : 300;
    setTimeout(()=>{ if(OIDO.activo) oidoArrancarRec(rec); }, espera);
  };
  OIDO.rec = rec;
  oidoArrancarRec(rec);
}
function oidoArrancarRec(rec){
  const track = OIDO.destino && OIDO.destino.stream.getAudioTracks()[0];
  try{ rec.start(track); OIDO.soportaTrack = true; }
  catch(e){
    // Chrome viejo: no acepta un canal específico, escucha la entrada predeterminada de la Mac
    try{ rec.start(); OIDO.soportaTrack = false; render(); }catch(_){}
  }
}

// Llega texto (parcial o final). Muestra, y si aparece una palabra clave, avisa UNA vez por frase.
function oidoFrase(texto, esFinal){
  const c = oidoCfg();
  if(esFinal){ OIDO.finales.unshift({t:texto.trim(), en:ahora()}); OIDO.finales=OIDO.finales.slice(0,8); OIDO.parcial=""; }
  else OIDO.parcial = texto;
  const el = document.getElementById("oido-txt");
  if(el) el.innerHTML = (OIDO.finales[0]?esc(OIDO.finales[0].t)+" ":"") + `<span class="parcial">${esc(OIDO.parcial)}</span>`;
  // compartir lo que se dice con las consolas (como mucho cada 1,5 s)
  if(esFinal || ahora()-OIDO.ultimoEnvioTexto > 1500){ OIDO.ultimoEnvioTexto=ahora(); oidoPatch({texto: texto.trim().slice(-160), textoEn: ahora()}); }

  // cada área tiene su propio anti-rebote: una vez por frase y no más de una cada 6 s
  OIDO.disparado = OIDO.disparado || {}; OIDO.ultimoAviso = OIDO.ultimoAviso || {};
  c.reglas.forEach(rg => {
    if(!rg.destino || !rg.palabras) return;
    const hit = buscarPalabra(texto, rg.palabras);
    if(hit && !OIDO.disparado[rg.destino] && ahora()-(OIDO.ultimoAviso[rg.destino]||0) > 6000){
      OIDO.disparado[rg.destino] = true; OIDO.ultimoAviso[rg.destino] = ahora();
      oidoAvisar(texto.trim(), hit, rg.destino);
    }
  });
  if(esFinal) OIDO.disparado = {};   // la próxima frase puede volver a avisar
}

function oidoAvisar(texto, palabra, destino){
  const msg = { nombre:"MD", area:"oido", deId:"oido", para:destino||"sonido", texto, en: ahora(), auto:true, palabra };
  OIDO.avisos = [{...msg}].concat(OIDO.avisos||[]).slice(0,10);
  if(S.r) Store.chat(S.r.sala, msg);
  else lanzarFlash(msg);   // sin reunión activa, por lo menos avisa en esta pantalla
  render();
}

function oidoMedir(){
  if(!OIDO.activo) return;
  const c = oidoCfg(); const buf = new Float32Array(1024);
  OIDO.analizadores.forEach((an,i)=>{
    an.getFloatTimeDomainData(buf);
    let sum=0; for(let k=0;k<buf.length;k++) sum+=buf[k]*buf[k];
    const rms = Math.sqrt(sum/buf.length); const db = rms>0 ? 20*Math.log10(rms) : -100;
    const pct = Math.max(0, Math.min(100, (db+60)/60*100));
    const bar = document.getElementById("mv-"+i); if(bar) bar.style.height = pct+"%";
    if(i===c.canal){
      const n=ahora();
      if(db > c.umbralDb){ OIDO.bajoDesde=0; if(!OIDO.sobreDesde) OIDO.sobreDesde=n;
        if(!OIDO.hablando && n-OIDO.sobreDesde>250){ OIDO.hablando=true; oidoPatch({hablando:true}); oidoPintarEstado(); } }
      else { OIDO.sobreDesde=0; if(!OIDO.bajoDesde) OIDO.bajoDesde=n;
        if(OIDO.hablando && n-OIDO.bajoDesde>1500){ OIDO.hablando=false; oidoPatch({hablando:false}); oidoPintarEstado(); } }
    }
  });
  OIDO.raf = requestAnimationFrame(oidoMedir);
}
function oidoPintarEstado(){
  const e=document.getElementById("oido-voz"); if(e) e.textContent = OIDO.hablando ? "● hay voz en el canal" : "silencio";
}

function oidoDetener(porError){
  OIDO.activo=false;
  cancelAnimationFrame(OIDO.raf); clearInterval(OIDO.latidoTimer);
  try{ OIDO.rec && OIDO.rec.abort(); }catch(e){}
  try{ OIDO.stream && OIDO.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ OIDO.ctx && OIDO.ctx.close(); }catch(e){}
  OIDO.rec=null; OIDO.stream=null; OIDO.ctx=null; OIDO.analizadores=[]; OIDO.hablando=false;
  oidoPatch({activo:false, hablando:false});
  render();
}

function vPulpito(){

  const cerrada = r.estado==="cerrada";
  // antes de la prédica: cuánto falta para que le toque, sumando lo que resta de las secciones previas
  let faltaPred = null;
  if(r.estado==="en_vivo" && cur && !cur.esPredica && i!=null){
    const pi = secs.findIndex((x,k)=>k>i && x.esPredica);

  }
  return `<div class="tv" style="justify-content:center;text-align:center;gap:clamp(14px,3vw,34px)">

let modoLinks=false;

// Varias notificaciones seguidas (alias que se resuelve, auth, un update) → un solo render.
// Y siempre fuera del handler que lo pidió: renderizar en medio de un blur/change
// rompe la transición de foco del navegador (lo vimos en las pruebas).
let _renderPendiente=false;
function render(){
  if(_renderPendiente) return;
  _renderPendiente=true;
  setTimeout(()=>{ _renderPendiente=false; renderAhora(); }, 0);
}

function renderAhora(){
  if(DRAG.on){ DRAG.pendiente=true; return; }   // no rehacer la pantalla en medio de un arrastre
  const app=$("#app");
  const v=S.vista;
  const pantallas = ["cabina","escenario","pulpito","cartel","llamar"];
  document.documentElement.setAttribute("data-screen",
    (pantallas.includes(v) && v!=="cartel") || v==="oido" ? "tv" : "app");

  // las pantallas de sala no piden identidad
  if(!pantallas.includes(v) && v!=="invitacion" && !S.yo){ app.innerHTML = vIdentidad(); return; }

  let html="";
  if(v==="admin")          html = (S.yo && !S.yo.admin) ? vLanding()
                                 : (modoLinks && S.r ? vLinks() : (S.editando ? vEditar() : vAdmin()));
  else if(v==="prod")      html = vProductor();
  else if(v==="consola")   html = vConsola();
  else if(v==="cartel")    html = vCartel();
  else if(v==="config")    html = vConfig();
  else if(v==="estadisticas") html = vEstadisticas();
  else if(v==="nueva")     html = vNueva();
  else if(v==="invitacion") html = vInvitacion();
  else if(v==="reporte")   html = vReporte();
  else if(v==="oido")      html = vOido();
  else if(v==="llamar")    html = vLlamar();
  else if(v==="area")      html = vArea();
  else if(v==="live")      html = vLive();
  else if(v==="cabina")    html = vCabina();
  else if(v==="escenario") html = vEscenario();
  else if(v==="pulpito")   html = vPulpito();
  else html = vAdmin();

  // Cada cambio en la base re-renderiza todo. Si alguien está escribiendo en
  // ese momento, hay que devolverle el foco, el cursor Y lo que llevaba escrito:
  // sin esto, cada tilde que marca otro voluntario te borra el mensaje a medias.
  const foco = document.activeElement;
  // los campos editables se reencuentran por sus data-* (no tienen id)
  const selDe = el => ["edit","t","i","j","f","id","fase","oreg","of"].filter(k=>el.dataset[k]!=null)
                        .map(k=>`[data-${k}="${CSS.escape(el.dataset[k])}"]`).join("");
  const focoId = foco && (foco.id || (foco.dataset && (foco.dataset.edit||foco.dataset.oreg!=null) ? "§"+selDe(foco) : null));
  const esTexto = foco && (foco.tagName==="TEXTAREA" || (foco.tagName==="INPUT" && !["checkbox","radio","date","time"].includes(foco.type)));
  const valorFoco = esTexto ? foco.value : null;
  const selStart = esTexto ? foco.selectionStart : null;
  const selEnd   = esTexto ? foco.selectionEnd : null;
  const scrollMsgs = $("#msgs");
  const msgsAbajo = !scrollMsgs || (scrollMsgs.scrollHeight - scrollMsgs.scrollTop - scrollMsgs.clientHeight < 40);

  app.innerHTML = html;

  if(focoId){
    let el = focoId[0]==="§" ? document.querySelector(focoId.slice(1)) : document.getElementById(focoId);
    if(el && el.focus){
      if(valorFoco!=null && el.value!==valorFoco) el.value = valorFoco;
      el.focus();
      try{ if(selStart!=null && el.setSelectionRange) el.setSelectionRange(selStart, selEnd==null?selStart:selEnd); }catch(_){}
    }
  }
  // el chat sigue abajo solo si ya estaba abajo: si alguien scrolleó para leer, no se lo movemos
  const m=$("#msgs"); if(m && msgsAbajo) m.scrollTop = m.scrollHeight;
  tick();
}

/* ticker: solo toca los nodos de tiempo, no re-renderiza */
function tick(){
  const r=S.r;
  const set=(id,val)=>{ const e=document.getElementById(id); if(e) e.textContent=val; };
  const re=document.getElementById("tk-reloj"); if(re) re.textContent=hhmmss(ahora());
  set("tk-reloj2", hhmm(ahora())); set("tk-reloj3", hhmm(ahora()));
  if(!r) return;
  const cur = r.secActiva!=null ? (r.secciones||[])[r.secActiva] : null;
  const rest = cur&&cur.arrancoEn ? cur.min*60000-(ahora()-cur.arrancoEn) : null;

  if(rest!=null){
    ["tk-cur","tk-sec","tk-tv","tk-live","tk-area","tk-esc","tk-pul","tk-cons"].forEach(id=>set(id, fmtDur(rest)));
    const cn=document.getElementById("tk-cons"); if(cn) cn.style.color = rest<0?"var(--late)":"var(--ink)";
    const p=document.getElementById("tk-pul");
    if(p && r.estado==="en_vivo"){ const nv = rest>5*60000?"ok":rest>0?"warn":"late";
      p.style.color = `var(--${nv})`;
      const s=document.querySelector(".sem"); if(s) s.className="sem "+nv; }
    const pp=document.getElementById("tk-pulpre");
    if(pp && r.secActiva!=null){
      const secs=r.secciones||[]; const i=r.secActiva;
      const pi = secs.findIndex((x,k)=>k>i && x.esPredica);
      if(pi>-1){ let f=Math.max(0,rest); for(let k=i+1;k<pi;k++) f+=(secs[k].min||0)*60000; pp.textContent=Math.ceil(f/60000); }
    }
    const e=document.getElementById("tk-esc"); if(e) e.style.color = rest<0?"var(--late)":"var(--ink)";
    const t=document.getElementById("tk-tv"); if(t) t.style.color = rest<0?"var(--late)":"var(--ink)";
  } else {
    const f = Math.max(0, (r.inicioMs||0)-ahora());
    ["tk-falta","tk-tvfalta","tk-esc","tk-cons"].forEach(id=>set(id, fmtDur(f)));
  }
  const ic=infoCanciones(r);
  if(ic && ic.actual && ic.actual.arrancoEn && !ic.actual.terminoEn){ set("tk-song", fmtDur(ahora()-ic.actual.arrancoEn)); set("tk-song2", fmtDur(ahora()-ic.actual.arrancoEn)); }
  document.querySelectorAll("[data-hasta]").forEach(el=>{ if(ahora() > +el.dataset.hasta) el.remove(); });
  const nd=document.getElementById("tk-nudge");
  if(nd) nd.hidden = !(r.estado==="preservicio" && ahora() > (r.inicioMs||0) + 60000);
  if(r.estado==="en_vivo"){
    const d=desvio(r);

// campos de config, asistente, plantillas y estadísticas
const ZONAS_V4 = ["wizr","ed","eds","tplr","tplc","can","cat","est"];
document.addEventListener("change", async ev=>{
  const el=ev.target;
  if(el.id==="csvCan" && el.files && el.files[0]){
    try{
      const txt = await el.files[0].text();
      const filas = parseCSV(txt);
      if(filas.length<2) return toast("El CSV está vacío");
      await importarCanciones(filasCSVaCanciones(filas));
    }catch(e){ toast(e.message||"No se pudo leer el CSV"); }
    el.value=""; return;
  }
  if(!el.dataset || !ZONAS_V4.includes(el.dataset.edit)) return;
  const z=el.dataset.edit, f=el.dataset.f;
  const val = el.type==="checkbox" ? el.checked : el.value;
  if(z==="wizr"){
    const w=S.wiz; if(!w) return;
    if(f==="plantilla"){
      if(w.tocado && !confirm("Cambiar el tipo vuelve a armar el orden y el setlist desde esa plantilla. ¿Seguís?")){ el.value=w.plantilla; return; }
      const pl=plantillas().find(p=>p.id===val); if(!pl) return;
      S.wiz={...borradorDePlantilla(pl, w.fecha, w.hora), titulo:w.titulo};
    } else w[f]=val;
    render(); return;
  }
  if(z==="ed"||z==="eds"){ await edCambio(el); return; }
  if(z==="tplr"){ if(!S.tplEdit) return; S.tplEdit[f]=val; S.tplEdit.tocado=true; render(); return; }
  if(z==="tplc"){
    const e=S.tplEdit; if(!e) return; const it=(e[el.dataset.fase]||[])[+el.dataset.i]; if(!it) return;
    it[f] = f==="off" ? (parseInt(val,10)||0) : val; e.tocado=true; render(); return;
  }
  if(z==="can"){
    let v=val; if(f==="bpm") v = parseInt(val,10)||null; else v = String(val).trim()||null;
    if(f==="nombre" && !v) return toast("La canción necesita un nombre");
    await asegurarCanciones(); await Store.setConfig(`canciones/${el.dataset.id}/${f}`, v); return;
  }
  if(z==="cat"){
    let v=val; if(f==="min") v=Math.max(1,parseInt(val,10)||1);
    await asegurarConfig(); await Store.setConfig(`catalogo/${el.dataset.id}/${f}`, v); return;
  }
  if(z==="est"){ S.est[f]=val; render(); return; }
});

// edición en vivo de campos del admin
document.addEventListener("change", async ev=>{
  const el=ev.target; if(!el.dataset || !el.dataset.edit) return;
  if(ZONAS_V4.includes(el.dataset.edit)) return;
  const r=S.r; if(!r) return;
  const zona=el.dataset.edit, f=el.dataset.f, i=el.dataset.i;
  let val = el.type==="checkbox" ? el.checked : el.value;
  if(f==="min"||f==="off") val = parseInt(val,10)||0;

  if(zona==="raiz"){
    const p={[f]:val};
    if(f==="fecha") p.inicioMs = epochDe(val, r.hora);
    if(f==="hora")  p.inicioMs = epochDe(r.fecha, val);
    await Store.patch(r.sala,p); return;
  }
  if(zona==="sec"){ await Store.patch(r.sala,{[`secciones/${i}/${f}`]:val}); return; }
  if(zona==="notas"){ await Store.patch(r.sala,{notas:val}); return; }
  await Store.patch(r.sala,{[`${zona}/${i}/${f}`]:val});
});

// Rol de quien entró con Google: dueño (CFG.admins), productor (invitado, está en la base) o ninguno.
async function resolverRol(u){
  if(!HAY_FIREBASE) return !!(S.yo && S.yo.admin);
  const mail = (u && !u.isAnonymous && u.email) ? u.email.toLowerCase() : null;
  const dueno = !!mail && CFG.admins.map(x=>x.toLowerCase()).includes(mail);
  const prod = dueno || (!!mail && await Store.esProductorEmail(mail));
  if(prod){
    const nombre = (S.yo && S.yo.email===mail && S.yo.nombre) || String(u.displayName||mail).split(" ")[0];
    guardarYo({nombre, areaId:"produccion", admin:true, dueno, email:mail});
  } else if(S.yo && S.yo.admin){
    // la sesión de Google se cayó o lo sacaron de productores: pasa a ser del equipo
    guardarYo({...S.yo, admin:false, dueno:false});
  }
  return prod;
}
async function linksAutomaticos(nueva){
  // si los links del equipo no apuntan a nada, o a una reunión que ya pasó, se pasan a la nueva
  const linked = S.lista.find(x=>x.sala===S.activa);
  if(!S.activa || !linked || esPasada(linked)){ await Store.activar(CFG.alias, nueva.sala); return true; }
  return false;
}
async function asegurarCanciones(){ if(!(S.cfg && S.cfg.canciones)) await Store.setConfig("canciones", copiaJSON(CANCIONES_DEF)); }
async function asegurarConfig(){
  if(!(S.cfg && S.cfg.plantillas)){ const o={}; PLANTILLAS_DEF.forEach((p,i)=>o[p.id]={...copiaJSON(p),orden:i}); await Store.setConfig("plantillas", o); }
  if(!(S.cfg && S.cfg.catalogo)){ const o={}; CATALOGO_DEF.forEach((c,i)=>o[c.id]={...c,orden:i}); await Store.setConfig("catalogo", o); }
}

cargarYo();
// modo demo: quien venía como productor de la versión anterior pasa a ser dueño
if(!HAY_FIREBASE && S.yo && S.yo.admin && S.yo.dueno==null) guardarYo({...S.yo, dueno:true});
Store.init(async u => {
  S.usuarioFb = u;
  if(!S.aceptando) await resolverRol(u);
  if(!arrancado){ arrancado = true; ruta(); }
  else { suscribir(); render(); }   // cambió el usuario (entró o salió el admin): reabrir todo con el token nuevo
});
window.addEventListener("hashchange", ruta);

// ---- que la pantalla no se apague en las vistas de sala ----
let _wake=null;
async function pedirWakeLock(){
  try{
    if(!("wakeLock" in navigator)) return;
    if(!["cabina","escenario","pulpito","oido","llamar"].includes(parseHash().vista)) return;
    if(_wake && !_wake.released) return;
    _wake = await navigator.wakeLock.request("screen");
  }catch(e){}
}
pedirWakeLock();
window.addEventListener("hashchange", pedirWakeLock);
// el sistema suelta el wake lock cuando la pestaña se oculta; al volver hay que pedirlo de nuevo
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") pedirWakeLock(); });
