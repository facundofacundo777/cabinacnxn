<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1413">
<title>Cabina CNXN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<!-- ============================================================
     CABINA CNXN  ·  app de reunión en vivo
     Archivo único. Vanilla JS + Firebase Realtime Database.

     PARA PONERLO EN PRODUCCIÓN:
       1. Creá un proyecto en console.firebase.google.com
       2. Activá Realtime Database y Authentication > Google
       3. Pegá tu config en CFG.firebase (más abajo)
       4. Subí este archivo a tu hosting
     Sin config, la app corre en MODO DEMO: los datos quedan en
     el navegador y se sincronizan entre pestañas del mismo equipo.
     ============================================================ -->

<style>
:root{
  --ground:#F2F4F3; --surface:#FFF; --surface-2:#E8ECEB; --surface-3:#DFE5E3;
  --line:#D2D9D8; --line-2:#B4BFBE;
  --ink:#131A19; --ink-2:#47534F; --ink-3:#6E7A76;
  --signal:#0C6E75; --signal-2:#DDEEEE;
  --ok:#2C7A52; --ok-bg:#DFF0E5;
  --warn:#A8720F; --warn-bg:#F7EBD3;
  --late:#A63A2C; --late-bg:#F6E0DC;
  --r:4px;
  --sh:0 1px 2px rgba(19,26,25,.06),0 8px 24px -12px rgba(19,26,25,.18);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#0E1413; --surface:#161E1D; --surface-2:#1E2827; --surface-3:#25302E;
  --line:#2A3634; --line-2:#3D4C49;
  --ink:#E8EDEC; --ink-2:#A9B5B2; --ink-3:#7C8987;
  --signal:#4FBDC2; --signal-2:#12302F;
  --ok:#5FBE87; --ok-bg:#14301F;
  --warn:#DDA43C; --warn-bg:#33260D;
  --late:#E0705E; --late-bg:#351B16;
  --sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
}}
[data-theme="dark"]{
  --ground:#0E1413; --surface:#161E1D; --surface-2:#1E2827; --surface-3:#25302E;
  --line:#2A3634; --line-2:#3D4C49;
  --ink:#E8EDEC; --ink-2:#A9B5B2; --ink-3:#7C8987;
  --signal:#4FBDC2; --signal-2:#12302F;
  --ok:#5FBE87; --ok-bg:#14301F;
  --warn:#DDA43C; --warn-bg:#33260D;
  --late:#E0705E; --late-bg:#351B16;
  --sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
}
/* pantallas de sala: siempre oscuras, se miran de lejos */
[data-screen="tv"]{
  --ground:#080C0B; --surface:#0F1514; --surface-2:#161E1D; --surface-3:#1E2827;
  --line:#212B29; --line-2:#33403D;
  --ink:#F2F6F5; --ink-2:#9DAAA7; --ink-3:#6B7876;
  --signal:#4FBDC2; --signal-2:#0F2A2A;
  --ok:#5FBE87; --ok-bg:#0F2618; --warn:#E5AC44; --warn-bg:#2B1F09; --late:#E8705B; --late-bg:#2E1611;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  min-height:100dvh; overscroll-behavior:none;
}
h1,h2,h3,h4{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;margin:0;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono,code{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
a{color:var(--signal)}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* ---------- primitivos ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--surface);border:1px solid var(--line-2);color:var(--ink);
  border-radius:var(--r);padding:9px 14px;cursor:pointer;
  font-size:14px;font-weight:500;line-height:1.2;transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--signal);border-color:var(--signal);color:#fff;font-weight:600}
[data-theme="dark"] .btn.pri,[data-screen="tv"] .btn.pri{color:#08201F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#08201F}}
.btn.pri:hover{filter:brightness(1.08)}
.btn.gh{background:transparent;border-color:transparent;color:var(--ink-3);padding:7px 9px}
.btn.gh:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{border-color:var(--late);color:var(--late)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.lg{padding:14px 22px;font-size:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.block{width:100%}

.inp,select.inp,textarea.inp{
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);
  padding:9px 11px;font-size:14.5px;width:100%;
}
.inp:focus{border-color:var(--signal);outline:none}
label.f{display:flex;flex-direction:column;gap:5px}
label.f>span{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}

.k{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.hide{display:none !important}
.muted{color:var(--ink-3)}
.tnum{font-variant-numeric:tabular-nums}

.chip{
  display:inline-flex;align-items:center;gap:5px;
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 7px;border-radius:2px;background:var(--surface-2);color:var(--ink-3);white-space:nowrap;
}
.chip.crit{background:var(--late-bg);color:var(--late)}
.chip.now{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.sig{background:var(--signal-2);color:var(--signal)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

/* ---------- shell ---------- */
.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:var(--surface);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1240px;margin:0 auto;padding:9px 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.brand{font-family:Archivo;font-weight:700;font-size:15px;letter-spacing:-.02em;white-space:nowrap}
.brand em{font-style:normal;color:var(--signal)}
.who{
  display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace;
}
.main{max-width:1240px;width:100%;margin:0 auto;padding:18px 16px 90px;flex:1}

/* ---------- barra de progreso ---------- */
.pbar{
  position:sticky;top:44px;z-index:25;background:var(--surface);
  border-bottom:1px solid var(--line);
}
.pbar-in{
  max-width:1240px;margin:0 auto;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));
}
.pcell{
  padding:9px 14px 11px;border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:4px;min-width:0;
}
.pcell:last-child{border-right:none}
.pcell .pv{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.pv.ok{color:var(--ok)} .pv.warn{color:var(--warn)} .pv.late{color:var(--late)} .pv.sig{color:var(--signal)}
.bar{display:block;height:3px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--signal);transition:width .3s}
.bar>i.ok{background:var(--ok)} .bar>i.warn{background:var(--warn)} .bar>i.late{background:var(--late)}

/* ---------- checklist ---------- */
.phase{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);
  position:sticky;top:0;z-index:2;
}
.phase .pc{color:var(--ink-3);letter-spacing:.05em}
.it{
  display:grid;grid-template-columns:auto 62px 1fr auto;gap:11px;
  padding:10px 14px;align-items:start;border-bottom:1px solid var(--line);
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
}
.it:last-child{border-bottom:none}
.it:hover{background:var(--surface-2)}
.it.ro{cursor:default}
.it.ro:hover{background:transparent}
.box{
  width:20px;height:20px;border-radius:3px;border:2px solid var(--line-2);
  flex:none;position:relative;margin-top:1px;transition:background .12s,border-color .12s;
}
.it.done .box{background:var(--ok);border-color:var(--ok)}
.it.done .box::after{
  content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;
  border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(43deg);
}
[data-screen="tv"] .it.done .box::after{border-color:#08201F}
.it .tt{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12.5px;color:var(--signal);padding-top:2px;font-variant-numeric:tabular-nums}
.it .tx{font-size:14.5px;line-height:1.4;padding-top:1px}
.it .mt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);white-space:nowrap;padding-top:4px;text-align:right}
.it.done .tx{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.it.done .tt{color:var(--ink-3)}
.it.over .tt{color:var(--late)}
.it.now{background:var(--warn-bg)}
.it.now .tt{color:var(--warn)}

/* ---------- secciones del programa ---------- */
.sec{
  display:grid;grid-template-columns:56px 1fr auto;gap:12px;
  padding:11px 14px;border-bottom:1px solid var(--line);align-items:center;
}
.sec:last-child{border-bottom:none}
.sec.live{background:var(--signal-2)}
.sec.past{opacity:.5}
.sec .sh{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sec.live .sh{color:var(--signal);font-weight:600}
.sec .st{font-size:15px;font-weight:500}
.sec .sd{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;height:100%;min-height:0}
.msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:9px;min-height:100px}
.msgs>:first-child{margin-top:auto}
.msg{display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.4}
.msg .mh{display:flex;gap:7px;align-items:baseline;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.05em}
.msg .mn{font-weight:600;text-transform:uppercase}
.msg .mw{color:var(--ink-3)}
.msg.mine .mb{color:var(--ink-2)}
.msg .mb{padding-left:1px}
.msg.dir .mb{border-left:2px solid var(--warn);padding-left:8px}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:9px 14px 0}
.quick .btn{font-size:12px;padding:5px 9px}
.chat-in{display:flex;gap:7px;padding:10px 14px;border-top:1px solid var(--line)}
.chat-in .inp{min-width:0}
.chat-in #chatPara{max-width:104px}

/* ---------- flash ---------- */
#flash{
  position:fixed;inset:0;z-index:200;display:none;
  align-items:center;justify-content:center;padding:24px;text-align:center;
  background:var(--warn);color:#1A1204;
}
#flash.on{display:flex;animation:fl .55s steps(1,end) 3}
@keyframes fl{0%,49%{opacity:1}50%,100%{opacity:.12}}
#flash .fw{max-width:900px;display:flex;flex-direction:column;gap:12px}
#flash .ff{font-family:"IBM Plex Mono",monospace;font-size:clamp(12px,2.4vw,18px);letter-spacing:.14em;text-transform:uppercase;opacity:.72}
#flash .fm{font-family:Archivo;font-weight:700;font-size:clamp(30px,8vw,84px);line-height:1.02}
@media (prefers-reduced-motion:reduce){#flash.on{animation:none}}

/* ---------- pantallas de sala ---------- */
.tv{min-height:100dvh;display:flex;flex-direction:column;padding:clamp(14px,2.4vw,30px);gap:clamp(10px,1.6vw,20px)}
.tv-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap}
.tv-title{font-family:Archivo;font-weight:600;font-size:clamp(16px,2.2vw,26px)}
.tv-clock{font-family:"IBM Plex Mono",monospace;font-size:clamp(18px,2.6vw,32px);font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.big{
  font-family:"IBM Plex Mono",monospace;font-weight:700;font-variant-numeric:tabular-nums;
  line-height:.92;letter-spacing:-.02em;
}
.tv-now{display:flex;flex-direction:column;gap:6px;flex:1;justify-content:center;min-height:0}
.tv-lbl{font-family:"IBM Plex Mono",monospace;font-size:clamp(10px,1.3vw,14px);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.tv-sec{font-family:Archivo;font-weight:700;font-size:clamp(34px,7.2vw,104px);line-height:1.02}
.tv-next{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;color:var(--ink-2);font-size:clamp(22px,3.6vw,48px);line-height:1.1}
.tv-next b{font-family:Archivo;font-weight:700;color:var(--ink)}
.tv-next .tv-lbl{font-size:clamp(12px,1.6vw,20px)}
/* título de la sección actual en escenario y púlpito: antes era una etiqueta chiquita */
.tv-cur{font-family:Archivo;font-weight:700;font-size:clamp(30px,6.4vw,92px);line-height:1.04;color:var(--ink)}
.tv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tv-cell{background:var(--surface);padding:11px 14px 13px;display:flex;flex-direction:column;gap:3px}
.tv-cell .cv{font-family:"IBM Plex Mono",monospace;font-size:clamp(17px,2.4vw,26px);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.sem{width:100%;height:10px;border-radius:5px;background:var(--ok)}
.sem.warn{background:var(--warn)} .sem.late{background:var(--late)}
.tv-msg{
  background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);
  border-radius:var(--r);padding:14px 18px;font-family:Archivo;font-weight:600;
  font-size:clamp(20px,3.6vw,44px);line-height:1.1;text-align:center;
}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;align-items:center}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:9px 14px;border:none;background:none;cursor:pointer;white-space:nowrap;
  font-size:13.5px;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab.on{color:var(--ink);border-bottom-color:var(--signal)}
.tab:hover{color:var(--ink)}
.tab.filtro{
  display:inline-flex;align-items:center;gap:6px;border-bottom-color:transparent;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
  border:1px solid var(--line-2);border-radius:var(--r);margin:4px 6px 4px 0;padding:5px 10px;
}
.tab.filtro.on{border-color:var(--signal);background:var(--signal-2);color:var(--signal)}

/* ---------- layout 2 columnas ---------- */
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}

/* ---------- misc ---------- */
.center{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px}
.panel{width:100%;max-width:430px;display:flex;flex-direction:column;gap:16px}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.areabtn{
  padding:13px 10px;border:1.5px solid var(--line-2);background:var(--surface);
  border-radius:var(--r);cursor:pointer;font-family:"IBM Plex Mono",monospace;
  font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;text-align:center;
}
.areabtn.on{border-color:var(--signal);background:var(--signal-2);color:var(--signal)}
.linkrow{
  display:flex;gap:8px;align-items:center;padding:9px 12px;
  border-bottom:1px solid var(--line);font-size:13.5px;
}
.linkrow:last-child{border-bottom:none}
.linkrow .lu{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);word-break:break-all}

/* ---------- bloques del programa ---------- */
.bloque{
  padding:7px 14px 5px;background:var(--surface-2);border-bottom:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);
}

/* ---------- chat con canales ---------- */
.chat-body{display:grid;grid-template-columns:98px minmax(0,1fr);flex:1;min-height:0}
.chat-rail{
  border-right:1px solid var(--line);background:var(--surface-2);
  display:flex;flex-direction:column;overflow-y:auto;padding:5px 0;gap:1px;
}
.ch{
  display:flex;align-items:center;gap:6px;padding:7px 9px;border:none;background:none;
  cursor:pointer;text-align:left;color:var(--ink-3);border-left:2px solid transparent;
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;width:100%;
}
.ch:hover{background:var(--surface-3);color:var(--ink)}
.ch.on{color:var(--ink);border-left-color:var(--signal);background:var(--surface)}
.ch .chn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .u{
  background:var(--late);color:#fff;border-radius:99px;min-width:16px;height:16px;
  display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;padding:0 4px;
}
.chat-main{display:flex;flex-direction:column;min-height:0;min-width:0}
@media (max-width:560px){
  .chat-body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .chat-rail{flex-direction:row;border-right:none;border-bottom:1px solid var(--line);overflow-x:auto;padding:4px 6px}
  .ch{width:auto;border-left:none;border-bottom:2px solid transparent;white-space:nowrap}
  .ch.on{border-left-color:transparent;border-bottom-color:var(--signal)}
}

/* ---------- consola (monitor de cabina) ---------- */
.cons{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.cons-head{
  display:flex;align-items:center;gap:14px;padding:8px 14px;flex:none;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.ch-sep{width:1px;align-self:stretch;background:var(--line)}
.ch-item{display:flex;flex-direction:column;gap:0;line-height:1.25;min-width:0}
.ch-item b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.ch-live{
  display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:var(--r);
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
}
.ch-live.on{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.ch-live b{font-size:14px;letter-spacing:0}
.cons-body{
  flex:1;min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr) 300px;
  gap:11px;padding:11px;overflow:hidden;
}
.cons-col{display:flex;flex-direction:column;gap:11px;min-height:0;overflow-y:auto;padding-bottom:6px}
.cons-col .tabs{position:sticky;top:0;z-index:6;background:var(--ground);padding-top:3px}
.cons-col:last-child{overflow:hidden}
.cons-col:last-child .chat{height:100%;max-height:none}
.cons-kpi{display:grid;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.cons-kpi.dos{grid-template-columns:1fr 1fr}
.cons-kpi.tres{grid-template-columns:1fr 1fr 1fr}
.cons-kpi.tres b{font-size:16px}
.cons-kpi>div{background:var(--surface);padding:9px 12px 10px;display:flex;flex-direction:column;gap:3px}
.cons-kpi b{font-size:19px;font-weight:600;line-height:1}
.cons-kpi b.ok{color:var(--ok)} .cons-kpi b.warn{color:var(--warn)} .cons-kpi b.late{color:var(--late)}

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = (n=6)=>{const a="abcdefghijkmnpqrstuvwxyz23456789";let s="";for(let i=0;i<n;i++)s+=a[Math.floor(Math.random()*a.length)];return s};
// Escenario y púlpito no son áreas de personas: son pantallas. Se les puede escribir
// desde el chat (solo el productor), y son las ÚNICAS que les hacen flash.
const DESTINOS_SALA = [
  { id:"escenario", nombre:"ESCENARIO", color:"#E5AC44" },
  { id:"pulpito",   nombre:"PÚLPITO",   color:"#E8705B" }
];
const area = id => CFG.areas.find(a=>a.id===id) || DESTINOS_SALA.find(a=>a.id===id)
                   || {id:id,nombre:(id||"—").toUpperCase(),color:"#888"};

function fmtDur(ms, signo){
  const neg = ms < 0; let s = Math.floor(Math.abs(ms)/1000);
  const h = Math.floor(s/3600); s -= h*3600;
  const m = Math.floor(s/60); s -= m*60;
  const p = n => String(n).padStart(2,"0");
  const core = h>0 ? `${h}:${p(m)}:${p(s)}` : `${m}:${p(s)}`;
  return (signo ? (neg?"−":"+") : (neg?"−":"")) + core;
}
function hhmm(ms){ const d=new Date(ms); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function hhmmss(ms){ const d=new Date(ms); return hhmm(ms)+":"+String(d.getSeconds()).padStart(2,"0"); }
function fechaLarga(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const dd = new Date(y, m-1, d);
  const dias=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  const mes=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  return `${dias[dd.getDay()]} ${d} de ${mes[m-1]}`;
}
function isoHoy(off=0){ const d=new Date(Date.now()+off*864e5);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function proximoDomingo(){ const d=new Date(); const add=(7-d.getDay())%7||7; return isoHoy(add); }
function epochDe(iso, hora){
  const [y,m,d]=iso.split("-").map(Number); const [H,M]=hora.split(":").map(Number);
  return new Date(y,m-1,d,H,M,0,0).getTime();
}
function toast(txt){
  const t=document.createElement("div"); t.className="toast"; t.textContent=txt;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2200);
}
async function copiar(txt){
  try{ await navigator.clipboard.writeText(txt); toast("Link copiado"); }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta);
    ta.select(); try{document.execCommand("copy"); toast("Link copiado");}catch(_){ toast("Copialo a mano"); }
    ta.remove();
  }
}

/* ==========================================================================
   4. ALMACENAMIENTO  (Firebase o demo local)
   ========================================================================== */
const HAY_FIREBASE = !!(CFG.firebase && CFG.firebase.databaseURL);
let db=null, auth=null;

if (HAY_FIREBASE){
  try{
    firebase.initializeApp(CFG.firebase);
    db = firebase.database();
    auth = firebase.auth();
  }catch(e){ console.error("Firebase no arrancó:", e); }
}

// Errores de la base: nunca en silencio. Un "permission denied" un domingo a las
// 8 de la mañana tiene que verse en pantalla, no solo en la consola del navegador.
function errDb(e){
  console.error("Firebase:", e);
  const code = String((e && e.code) || e || "");
  if(/PERMISSION_DENIED|permission/i.test(code))
    toast("Sin permiso en la base: revisá las reglas de Firebase (botón Reglas, en Admin)");
  else if(/network|unavailable|disconnected/i.test(code))
    toast("Sin conexión con la base");
  else toast("No se pudo guardar");
}

const Store = HAY_FIREBASE ? {
  modo:"firebase",
  offset:0,
  init(cb){
    db.ref(".info/serverTimeOffset").on("value", s => { this.offset = s.val() || 0; });
    db.ref(".info/connected").on("value", s => setConectado(!!s.val()));
    auth.onAuthStateChanged(u => {
      // Todo el mundo entra autenticado, aunque sea de forma anónima e invisible.
      // El voluntario no ve ningún login: solo permite que las reglas de la base
      // exijan un token en vez de estar abiertas a cualquiera de internet.
      if(!u){
        auth.signInAnonymously().catch(e=>{
          console.error("Falta activar Authentication → Anónimo en la consola de Firebase.", e);
          toast("Falta activar el ingreso anónimo en Firebase");
        });
        return;
      }
      // Recién acá arranca la app. Si las suscripciones se abrieran antes de tener
      // usuario, la base las rechazaría y Firebase las da de baja para siempre:
      // la pantalla quedaría vacía hasta recargar. Es el bug clásico del primer
      // domingo en un celular nuevo.
      cb(u);
    });
  },
  esAdmin(u){ return !!(u && u.email && !u.isAnonymous); },
  loginAdmin(){ return auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); },
  logoutAdmin(){ return auth.signOut(); },
  onReunion(sala, cb){
    const r=db.ref("salas/"+sala);
    const h=r.on("value", s=>cb(s.val()), errDb);
    return ()=>r.off("value",h);
  },
  onLista(cb){
    const r=db.ref("salas").orderByChild("inicioMs").limitToLast(40);
    const h=r.on("value", s=>{const o=s.val()||{}; cb(Object.values(o));}, errDb);
    return ()=>r.off("value",h);
  },
  guardar(sala, obj){ return db.ref("salas/"+sala).set(obj).catch(errDb); },
  patch(sala, patch){ return db.ref("salas/"+sala).update(patch).catch(errDb); },
  borrar(sala){ return db.ref("salas/"+sala).remove().catch(errDb); },
  chat(sala, msg){ return db.ref("salas/"+sala+"/chat").push(msg).catch(errDb); },
  onActiva(alias, cb){
    const r=db.ref("activa/"+alias);
    const h=r.on("value", s=>cb(s.val()), errDb);
    return ()=>r.off("value",h);
  },
  activar(alias, sala){ return db.ref("activa/"+alias).set(sala||null).catch(errDb); }
} : {
  modo:"demo",
  offset:0,
  _bc: (typeof BroadcastChannel!=="undefined") ? new BroadcastChannel("cabina-cnxn") : null,
  _subs:{}, _lista:[],
  _leer(){ try{ return JSON.parse(localStorage.getItem("cabina.salas")||"{}"); }catch(e){ return {}; } },
  _escribir(o){ localStorage.setItem("cabina.salas", JSON.stringify(o)); this._avisar(); },
  _avisar(){ if(this._bc) this._bc.postMessage("x"); this._emitir(); },
  _emitir(){
    // asíncrono a propósito: Firebase también avisa después, nunca dentro del handler que escribió
    setTimeout(()=>{
      const o=this._leer();
      Object.keys(this._subs).forEach(k=>{ (this._subs[k]||[]).forEach(f=>f(o[k]||null)); });
      this._lista.forEach(f=>f(Object.values(o)));
    },0);
  },
  init(cb){
    if(this._bc) this._bc.onmessage = ()=> this._emitir();
    window.addEventListener("storage", e=>{ if(e.key==="cabina.salas") this._emitir(); });
    cb(null);
  },
  loginAdmin(){ return Promise.reject(new Error("demo")); },
  esAdmin(){ return false; },
  logoutAdmin(){ return Promise.resolve(); },
  onReunion(sala, cb){
    (this._subs[sala] = this._subs[sala]||[]).push(cb);
    setTimeout(()=>cb(this._leer()[sala]||null),0);
    return ()=>{ this._subs[sala]=(this._subs[sala]||[]).filter(f=>f!==cb); };
  },
  onLista(cb){
    this._lista.push(cb);
    setTimeout(()=>cb(Object.values(this._leer())),0);
    return ()=>{ this._lista=this._lista.filter(f=>f!==cb); };
  },
  guardar(sala,obj){ const o=this._leer(); o[sala]=obj; this._escribir(o); return Promise.resolve(); },
  patch(sala,patch){
    const o=this._leer(); const base=o[sala]||{};
    Object.keys(patch).forEach(k=>{
      const partes=k.split("/");
      if(partes.length===1){ base[k]=patch[k]; }
      else{ let cur=base; for(let i=0;i<partes.length-1;i++){ cur[partes[i]]=cur[partes[i]]||{}; cur=cur[partes[i]]; }
            cur[partes[partes.length-1]]=patch[k]; }
    });
    o[sala]=base; this._escribir(o); return Promise.resolve();
  },
  borrar(sala){ const o=this._leer(); delete o[sala]; this._escribir(o); return Promise.resolve(); },
  chat(sala,msg){
    const o=this._leer(); const r=o[sala]; if(!r) return Promise.resolve();
    r.chat = r.chat||{}; r.chat["m_"+Date.now()+"_"+uid(3)] = msg;
    o[sala]=r; this._escribir(o); return Promise.resolve();
  },
  _actCbs:{},
  onActiva(alias, cb){
    const arr = this._actCbs[alias] = this._actCbs[alias]||[];
    arr.push(cb);
    const emit = ()=> cb(localStorage.getItem("cabina.activa."+alias));
    setTimeout(emit, 0);
    if(this._bc) this._bc.addEventListener("message", emit);
    window.addEventListener("storage", emit);
    return ()=>{
      this._actCbs[alias]=(this._actCbs[alias]||[]).filter(f=>f!==cb);
      if(this._bc) this._bc.removeEventListener("message", emit);
      window.removeEventListener("storage", emit);
    };
  },
  activar(alias, sala){
    if(sala) localStorage.setItem("cabina.activa."+alias, sala);
    else localStorage.removeItem("cabina.activa."+alias);
    (this._actCbs[alias]||[]).forEach(f=>f(sala||null));   // esta misma pestaña
    this._avisar();                                        // las demás
    return Promise.resolve();
  }
};

function nuevaReunion(plantillaId, fecha, hora, titulo){
  const pl = PLANTILLAS.find(p=>p.id===plantillaId) || PLANTILLAS[0];
  const sala = uid(4)+uid(4)+uid(4);
  const secciones = (pl.secciones||[]).map((s,i)=>({
    id:"s"+i+"_"+uid(3), bloque: s.bloque||"", titulo:s.titulo, min:s.min, area:s.area||"produccion",
    esPredica: !!s.esPredica, notas:"", arrancoEn:null, terminoEn:null
  }));
  const mk = (arr, tipo) => (arr||[]).map((c,i)=>({
    id:"c"+tipo+i+"_"+uid(3), texto:c.texto, area:c.area||"produccion",
    critico:!!c.critico, off: c.off!=null?c.off:null,
    secId: c.sec!=null ? (secciones[c.sec]||{}).id||null : null,
    hecho:false, por:null, en:null
  }));
  return {
    sala, titulo: titulo || pl.nombre, plantilla: pl.id,
    fecha, hora, inicioMs: epochDe(fecha,hora),
    estado:"preservicio", creada: ahora(),
    arrancoEn:null, cerradaEn:null, secActiva:null,
    secciones, pre:mk(pl.pre,"p"), vivo:mk(pl.vivo,"v"), post:mk(pl.post,"o"),
    notas:"", recordatorios:[], avisoPulpito:null, chat:{}
  };
}
const listaChecks = r => [...(r.pre||[]), ...(r.vivo||[]), ...(r.post||[])];
const esProductor = () => !!(S.yo && S.yo.admin);
// por defecto el voluntario ve solo lo suyo; el productor ve todo
const filtroMio = () => S.soloMio==null ? !esProductor() : S.soloMio;
function progreso(arr){ const t=(arr||[]).length, h=(arr||[]).filter(c=>c.hecho).length;
  return {t, h, pct: t? Math.round(h/t*100):0}; }

// horarios objetivo del plan: siempre desde la hora prevista de inicio
function horarios(r){
  let acc = r.inicioMs; const out=[];
  (r.secciones||[]).forEach(s=>{ out.push(acc); acc += (s.min||0)*60000; });
  return {inicios: out, fin: acc};
}
// desvío = cuánto tarde (o temprano) arrancó lo que está sonando ahora
function desvio(r){
  if(r.estado!=="en_vivo" && r.estado!=="cerrada") return 0;
  const h = horarios(r);
  const idx = r.secActiva;
  if(idx==null) return (r.cerradaEn || r.arrancoEn || ahora()) - h.fin;
  const s = (r.secciones||[])[idx];
  const arranco = s && s.arrancoEn ? s.arrancoEn : (r.arrancoEn || ahora());
  return arranco - (h.inicios[idx] != null ? h.inicios[idx] : r.inicioMs);
}
function finProyectado(r){
  const secs = r.secciones||[];
  if(r.estado!=="en_vivo") return horarios(r).fin;
  const idx = r.secActiva==null?0:r.secActiva;
  let restante = 0;
  for(let i=idx;i<secs.length;i++){
    const dur=(secs[i].min||0)*60000;
    if(i===idx && secs[i].arrancoEn){ restante += Math.max(0, dur-(ahora()-secs[i].arrancoEn)); }
    else restante += dur;
  }
  return ahora()+restante;
}
function nivel(msDesvio){
  const m = Math.abs(msDesvio)/60000;
  if(m <= CFG.semaforo.ok) return "ok";
  if(m <= CFG.semaforo.warn) return "warn";
  return "late";
}
// hora objetivo de un check pre/post
function horaCheck(r, c, fase){
  if(fase==="pre")  return (r.inicioMs||0) + (c.off||0)*60000;
  if(fase==="post") return (r.cerradaEn || horarios(r).fin) + (c.off||0)*60000;
  return null;
}
function estadoCheck(r, c, fase){
  if(c.hecho) return "done";
  if(fase==="post" && r.estado!=="cerrada") return "";
  if(fase==="pre" && r.estado==="cerrada") return "";
  const t = horaCheck(r,c,fase);
  if(fase==="vivo"){
    const idx=(r.secciones||[]).findIndex(s=>s.id===c.secId);
    if(idx>-1 && idx===r.secActiva) return "now";
    if(idx>-1 && r.secActiva!=null && idx<r.secActiva) return "over";
    return "";
  }
  if(t==null) return "";
  const n=ahora();
  if(n > t) return "over";
  if(n > t - 5*60000) return "now";
  return "";
}

/* ==========================================================================
   7. RUTEO
      #/            → admin (o identidad)
      #/r/SALA      → productor
      #/a/SALA      → vista de área
      #/v/SALA/tipo → cabina | escenario | pulpito | live
   ========================================================================== */
function parseHash(){
  const h = (location.hash||"").replace(/^#\/?/,"");
  const p = h.split("/").filter(Boolean);
  if(!p.length) return {vista:"admin"};
  if(p[0]==="r" && p[1]) return {vista:"prod", sala:p[1]};
  if(p[0]==="c" && p[1]) return {vista:"consola", sala:p[1]};
  if(p[0]==="cartel") return {vista:"cartel"};
  if(p[0]==="reporte" && p[1]) return {vista:"reporte", sala:p[1]};
  if(p[0]==="a" && p[1]) return {vista:"area", sala:p[1]};
  if(p[0]==="v" && p[1] && p[2]) return {vista:p[2], sala:p[1]};
  return {vista:"admin"};
}
function irA(hash){ location.hash = hash; }

function subReunion(sala){
  if(S.unsub){ S.unsub(); S.unsub=null; }
  if(!sala){ S.r=null; render(); return; }
  S.chatBase = false;
  S.unsub = Store.onReunion(sala, r => {
      const antes = S.r;
      S.r = r;
      if(r){
        if(!S.chatBase){
          // primera carga: tomamos como leído todo lo que ya estaba, sin flashear
          const ms = Object.values(r.chat||{}).map(m=>m.en||0);
          S.ultimoChat = ms.length ? Math.max(...ms) : 0;
          S.chatBase = true;
        } else detectarFlash(antes, r);
      }
    render();
  });
}

function suscribir(){
  if(S.unsub){ S.unsub(); S.unsub=null; }
  if(S.unsubLista){ S.unsubLista(); S.unsubLista=null; }
  if(S.unsubAlias){ S.unsubAlias(); S.unsubAlias=null; }
  if(S.unsubActiva){ S.unsubActiva(); S.unsubActiva=null; }
  S.salaReal = null;   // si no, al resuscribir con el alias el early-return de abajo dejaría la reunión sin listener

  if(S.sala === CFG.alias){
    // link permanente: seguimos a la reunión que el admin marcó como activa
    S.unsubAlias = Store.onActiva(CFG.alias, real => {
      if(real === S.salaReal) return;
      S.salaReal = real; S.r = null;
      subReunion(real);
      if(!real) render();
    });
    return;
  }
  if(S.sala){ S.salaReal = S.sala; subReunion(S.sala); return; }

  // panel de admin: lista de reuniones + cuál está activa.
  // La lista solo la pide el productor: las reglas se la niegan a cualquier otro
  // y un listener rechazado muere para siempre.
  S.unsubActiva = Store.onActiva(CFG.alias, real => { S.activa = real; render(); });
  if(esProductor()){
    S.unsubLista = Store.onLista(l => {
      S.lista = (l||[]).sort((a,b)=>(b.inicioMs||0)-(a.inicioMs||0));
      render();
    });
  }
}

function ruta(){
  const {vista, sala} = parseHash();
  const cambio = (vista!==S.vista) || (sala!==S.sala);
  S.vista = vista; S.sala = sala || null;
  if(cambio){ S.r=null; S.ultimoChat=0; S.chatBase=false; suscribir(); }
  render();
}

let flashTimer=null;
function detectarFlash(antes, r){
  const vistasConFlash = ["prod","consola","area","cabina","escenario","pulpito","live"];
  if(!vistasConFlash.includes(S.vista)) return;
  const msgs = Object.entries(r.chat||{}).map(([k,v])=>({id:k,...v})).sort((a,b)=>(a.en||0)-(b.en||0));
  if(!msgs.length) return;
  const nuevo = msgs[msgs.length-1];
  if((nuevo.en||0) <= S.ultimoChat) return;
  S.ultimoChat = nuevo.en||0;
  if(nuevo.deId && nuevo.deId===sesionId()) return;          // no me flasheo a mí mismo
  const para = nuevo.para || "todos";
  let paraMi;
  if(S.vista==="escenario" || S.vista==="pulpito"){
    // escenario y púlpito: solo si el mensaje es para ellos. Un "Todos" no los distrae.
    paraMi = para===S.vista;
  } else if(S.vista==="cabina"){
    // la TV de cabina es de todos: solo los mensajes a Todos, aunque el navegador tenga un nombre guardado
    paraMi = para==="todos";
  } else {
    // el resto: lo que va a Todos, o lo que va a MI área. Un mensaje a Sonido no flashea en Video.
    const miArea = S.yo ? S.yo.areaId : null;   // la TV de cabina no tiene área: solo recibe los de Todos
    paraMi = para==="todos" || (miArea && para===miArea);
  }
  if(!paraMi) return;
  lanzarFlash(nuevo);
}
function lanzarFlash(m){
  const f=$("#flash"); const c = area(m.area).color;
  f.style.background = c; f.style.color = "#0B0F0E";
  $("#flashFrom").textContent = m.nombre + " · " + area(m.area).nombre + (m.para && m.para!=="todos" ? " → "+area(m.para).nombre : "");
  $("#flashMsg").textContent = m.texto;
  f.classList.remove("on"); void f.offsetWidth; f.classList.add("on");
  if(navigator.vibrate) try{ navigator.vibrate([120,70,120]); }catch(e){}
  clearTimeout(flashTimer);
  flashTimer = setTimeout(()=> f.classList.remove("on"), 1750);
}
function sesionId(){
  // por PESTAÑA, no por navegador: si fuera por navegador, dos pestañas de la
  // misma máquina se verían como la misma persona y el flash se silenciaría.
  let s = sessionStorage.getItem("cabina.sid");
  if(!s){ s = uid(8); sessionStorage.setItem("cabina.sid", s); }
  return s;
}

const A = {};

A.marcar = (fase, id) => {
  const r=S.r; if(!r) return;
  const arr = r[fase]||[]; const i = arr.findIndex(c=>c.id===id); if(i<0) return;
  const c = arr[i]; const nuevo = !c.hecho;
  Store.patch(r.sala, {
    [`${fase}/${i}/hecho`]: nuevo,
    [`${fase}/${i}/por`]: nuevo ? (S.yo?S.yo.nombre:"—") : null,
    [`${fase}/${i}/en`]: nuevo ? ahora() : null
  });
};

A.iniciar = () => {
  const r=S.r; if(!r) return;
  Store.patch(r.sala, { estado:"en_vivo", arrancoEn: ahora(), secActiva:0, "secciones/0/arrancoEn": ahora() });
};
A.avanzar = (delta) => {
  const r=S.r; if(!r||r.estado!=="en_vivo") return;
  const secs=r.secciones||[]; const cur = r.secActiva==null?0:r.secActiva;
  const next = cur + delta;
  if(next<0 || next>=secs.length) return;   // la última sección se termina con "Cerrar reunión", que pregunta
  const p={};
  p[`secciones/${cur}/terminoEn`] = ahora();
  p[`secciones/${next}/arrancoEn`] = ahora();
  p["secActiva"] = next;
  Store.patch(r.sala, p);
};
A.ajustar = (min) => {
  const r=S.r; if(!r) return;
  const i = r.secActiva; if(i==null) return;
  const s = (r.secciones||[])[i]; if(!s) return;
  const nm = Math.max(1, (s.min||0)+min);
  Store.patch(r.sala, {[`secciones/${i}/min`]: nm});
};
A.cerrar = () => {
  const r=S.r; if(!r) return;
  const p = {estado:"cerrada", cerradaEn: ahora(), secActiva:null};
  if(r.secActiva!=null) p[`secciones/${r.secActiva}/terminoEn`]=ahora();
  Store.patch(r.sala, p);
};
A.reabrir = () => {
  const r=S.r; if(!r) return;
  Store.patch(r.sala, {estado:"en_vivo", cerradaEn:null, secActiva: Math.max(0,(r.secciones||[]).length-1)});
};

// A quién va un mensaje según el canal abierto. Si un voluntario escribe en el canal
// de su propia área, le está hablando a producción (si no, se mandaría a sí mismo).
function destinoDe(canal){
  if(!canal || canal==="todos") return "todos";
  if(S.yo && !esProductor() && canal===S.yo.areaId) return "produccion";
  return canal;
}
A.enviar = (texto, para) => {
  const r=S.r; if(!r||!texto.trim()||!S.yo) return;
  Store.chat(r.sala, {
    nombre:S.yo.nombre, area:S.yo.areaId, deId:sesionId(),
    para: para||"todos", texto:texto.trim().slice(0,300), en: ahora()
  });
};
A.avisoPulpito = (texto) => {
  const r=S.r; if(!r) return;
  Store.patch(r.sala, {avisoPulpito: texto ? {texto, en: ahora()} : null});
};

function cProgreso(r, opts={}){
  const pre=progreso(r.pre), viv=progreso(r.vivo), pos=progreso(r.post);
  const críticos = listaChecks(r).filter(c=>c.critico && !c.hecho);
  const vencidos = (r.pre||[]).filter(c=>!c.hecho && estadoCheck(r,c,"pre")==="over").length
                 + (r.post||[]).filter(c=>!c.hecho && estadoCheck(r,c,"post")==="over").length;
  const d = desvio(r), nv = nivel(d);
  const enVivo = r.estado==="en_vivo";
  const faltan = r.inicioMs - ahora();

  const celda = (k,v,cls,pct,barcls) => `<div class="pcell">
      <span class="k">${k}</span>
      <span class="pv ${cls||''}" ${pct!=null?'':''}>${v}</span>
      ${pct!=null?`<span class="bar"><i class="${barcls||''}" style="width:${pct}%"></i></span>`:''}
    </div>`;

  return `<div class="pbar"><div class="pbar-in">
    ${celda("Pre reunión", `${pre.h} / ${pre.t}`, pre.pct===100?"ok":"", pre.pct, pre.pct===100?"ok":"")}
    ${celda("Durante",     `${viv.h} / ${viv.t}`, viv.pct===100?"ok":"", viv.pct, viv.pct===100?"ok":"")}
    ${celda("Post",        `${pos.h} / ${pos.t}`, pos.pct===100?"ok":"", pos.pct, pos.pct===100?"ok":"")}
    ${ enVivo
        ? celda("Desvío", `<span id="tk-desvio">${fmtDur(d,true)}</span>`, nv)
        : celda(faltan>0?"Falta para arrancar":"Hora de inicio",
                `<span id="tk-falta">${faltan>0?fmtDur(faltan):hhmm(r.inicioMs)}</span>`,
                faltan>0 && faltan<15*60000 ? "warn":"") }
    ${celda("Vencidos", String(vencidos), vencidos?"late":"")}
    ${celda("Críticos", String(críticos.length), críticos.length?"late":"ok")}
  </div></div>`;
}

function cChecklist(r, fase, opts={}){
  const arr = r[fase]||[];
  const filtro = opts.area || null;

  if(!items.length) return `<div class="card"><div class="phase"><span>${titulos[fase]}</span></div><div class="empty">Sin ítems para esta área.</div></div>`;

  const filas = items.map(c => {
    const st = estadoCheck(r,c,fase);
    const t = horaCheck(r,c,fase);
    const sec = c.secId ? (r.secciones||[]).find(s=>s.id===c.secId) : null;
    const secIdx = sec ? (r.secciones||[]).indexOf(sec)+1 : 0;
    const etiqueta = fase==="vivo"
      ? (sec ? "S"+secIdx : "—")
      : (c.off!=null ? (c.off<0?"T−"+Math.abs(c.off):"T+"+c.off) : "—");
    const meta = c.hecho
      ? `${esc(c.por||"—")} · ${c.en?hhmm(c.en):""}`
      : (t!=null && st==="over" ? "vencido "+hhmm(t) : (t!=null?hhmm(t):""));
    return `<div class="it ${c.hecho?'done':''} ${st==='over'&&!c.hecho?'over':''} ${st==='now'&&!c.hecho?'now':''} ${opts.ro?'ro':''}"

      </span>
      <span class="mt">${esc(meta)}</span>

  }).join("");

  return `<div class="card">
    <div class="phase"><span>${titulos[fase]}</span><span class="pc">${p.h} de ${p.t} · ${p.pct}%</span></div>
    ${filas}
  </div>`;
}

function cSecciones(r, opts={}){
  const h = horarios(r);
  let bloqueActual = null;
  const filas = (r.secciones||[]).map((sec,i)=>{
    const viva = r.secActiva===i && r.estado==="en_vivo";
    const pasada = r.secActiva!=null && i<r.secActiva;
    let dur;
    if(viva && sec.arrancoEn){
      const rest = sec.min*60000-(ahora()-sec.arrancoEn);
      dur = `<span id="tk-sec" style="${rest<0?'color:var(--late)':''}">${fmtDur(rest)}</span>`;
    } else if(sec.arrancoEn && sec.terminoEn){
      dur = fmtDur(sec.terminoEn-sec.arrancoEn)+" / "+sec.min+"′";
    } else dur = sec.min+"′";

    let cabecera = "";
    if(sec.bloque && sec.bloque!==bloqueActual){
      bloqueActual = sec.bloque;
      cabecera = `<div class="bloque">${esc(sec.bloque)}</div>`;
    }
    const control = opts.control && r.estado==="en_vivo" && !viva
      ? `<button class="btn gh sm" data-act="irsec" data-i="${i}" title="Saltar a esta sección">▸</button>` : "";

    return cabecera + `<div class="sec ${viva?'live':''} ${pasada?'past':''}">
      <span class="sh">${hhmm(h.inicios[i])}</span>
      <span class="st">${esc(sec.titulo)}
        ${sec.esPredica?'<span class="chip sig">púlpito</span>':''}
        ${sec.notas?`<div class="muted" style="font-size:12.5px">${esc(sec.notas)}</div>`:''}
      </span>
      <span class="sd">${dur}${control}</span>
    </div>`;

function vistoDe(sala){
  try{ return JSON.parse(localStorage.getItem("cabina.visto."+sala)||"{}"); }catch(e){ return {}; }
}
function marcarVisto(sala, canal, t){
  const v = vistoDe(sala); v[canal] = t;
  try{ localStorage.setItem("cabina.visto."+sala, JSON.stringify(v)); }catch(e){}
}

function cChat(r, opts={}){
  const todos = Object.entries(r.chat||{}).map(([k,v])=>({id:k,...v})).sort((a,b)=>(a.en||0)-(b.en||0));
  const canal = S.canal || "todos";
  const enCanal = (m,c) => c==="todos" ? true : (m.para===c || m.area===c);
  const msgs = todos.filter(m=>enCanal(m,canal)).slice(-80);

  const visto = vistoDe(r.sala);
  const sinLeer = c => todos.filter(m => enCanal(m,c) && (m.en||0) > (visto[c]||0) && m.deId!==sesionId()).length;
  marcarVisto(r.sala, canal, ahora());

  const canalesSala = esProductor() ? DESTINOS_SALA : [];
  const rail = [{id:"todos",nombre:"TODOS",color:"var(--ink-2)"}, ...CFG.areas, ...canalesSala].map(a=>{
    const n = a.id===canal ? 0 : sinLeer(a.id);
    return `<button class="ch ${a.id===canal?'on':''}" data-act="canal" data-c="${a.id}">
      <span class="dot" style="color:${a.color}"></span>
      <span class="chn">${esc(a.nombre)}</span>
      ${n?`<span class="u">${n>9?'9+':n}</span>`:''}
    </button>`;
  }).join("");

  const cuerpo = msgs.length ? msgs.map(m=>{
    const mio = m.deId===sesionId();
    const dirigido = m.para && m.para!=="todos";
    return `<div class="msg ${mio?'mine':''} ${dirigido?'dir':''}">
      <div class="mh">
        <span class="mn" style="color:${area(m.area).color}">${esc(m.nombre)}</span>
        ${dirigido?`<span class="mw">→ ${esc(area(m.para).nombre)}</span>`:''}
        <span class="mw">${m.en?hhmm(m.en):''}</span>
      </div>
      <div class="mb">${esc(m.texto)}</div>
    </div>`;
  }).join("") : '<div class="empty">Nada en este canal todavía.</div>';

  const destino = destinoDe(canal);
  const rapidos = CFG.rapidos.map(t=>`<button class="btn sm" data-act="rapido" data-t="${esc(t)}">${esc(t)}</button>`).join("");

  return `<div class="card chat" style="max-height:${opts.alto||'420px'}">
    <div class="phase"><span>Chat</span>
      <span class="pc">${destino==="todos"?"a todo el equipo":"a "+esc(area(destino).nombre)}</span></div>
    <div class="chat-body">
      <div class="chat-rail">${rail}</div>
      <div class="chat-main">
        <div class="msgs" id="msgs">${cuerpo}</div>
        ${opts.ro ? '' : `
          <div class="quick">${rapidos}</div>
          <div class="chat-in">
            <input class="inp" id="chatTxt" data-para="${destino}" maxlength="300" autocomplete="off" value="${esc(S.borrador||"")}"
                   placeholder="${destino==="todos"?"A todos…":"A "+esc(area(destino).nombre)+"…"}">
            <button class="btn pri" data-act="enviar">↑</button>
          </div>`}
      </div>
    </div>
  </div>`;
}

// Las reglas de Firebase, con los mails de CFG.admins ya adentro.
// Se copian desde el panel de admin para que no haya que editarlas a mano.
function reglasFirebase(){
  const cond = CFG.admins.length
    ? "(" + CFG.admins.map(m=>`auth.token.email == '${m}'`).join(" || ") + ")"
    : "false";
  const esAdmin = `auth != null && auth.token.email_verified == true && ${cond}`;
  return JSON.stringify({
    rules: {
      salas: {
        ".read": esAdmin,
        ".indexOn": "inicioMs",
        "$sala": {
          ".read":  "auth != null",
          ".write": "auth != null && $sala.length >= 12"
        }
      },
      activa: {
        ".read": "auth != null",
        "$alias": { ".write": esAdmin }
      }
    }
  }, null, 2);
}

function vReporte(){
  const r=S.r; if(!r) return cTopbar()+cSinReunion();
  const h = horarios(r); const secs = r.secciones||[];
  const cerrada = r.estado==="cerrada";
  const finReal = r.cerradaEn || null;

  // --- secciones: planificado vs real
  const filasSec = secs.map((sec,i)=>{
    const plan = (sec.min||0)*60000;
    const real = sec.arrancoEn && sec.terminoEn ? sec.terminoEn-sec.arrancoEn : null;
    const dif  = real!=null ? real-plan : null;
    const arrDesv = sec.arrancoEn ? sec.arrancoEn - h.inicios[i] : null;
    const cls = v => v==null ? "" : Math.abs(v)<=60000 ? "ok" : Math.abs(v)<=3*60000 ? "warn" : "late";
    return `<tr>
      <td>${esc(sec.titulo)}${sec.bloque?`<span class="chip" style="margin-left:8px">${esc(sec.bloque)}</span>`:""}</td>
      <td class="mono">${hhmm(h.inicios[i])}</td>
      <td class="mono">${sec.arrancoEn?hhmm(sec.arrancoEn):"—"}</td>
      <td class="mono ${cls(arrDesv)}">${arrDesv!=null?fmtDur(arrDesv,true):"—"}</td>
      <td class="mono">${sec.min}′</td>
      <td class="mono">${real!=null?fmtDur(real):"—"}</td>
      <td class="mono ${cls(dif)}">${dif!=null?fmtDur(dif,true):"—"}</td>
    </tr>`;
  }).join("");

  // --- checklist: sin cerrar y cerrados tarde
  const fases = [["pre","Pre reunión"],["vivo","Durante"],["post","Post reunión"]];
  const tarde = (c,fase) => {
    if(!c.hecho || !c.en) return false;
    if(fase==="vivo"){ const sec=secs.find(x=>x.id===c.secId); return !!(sec && sec.terminoEn && c.en > sec.terminoEn); }
    const t = horaCheck(r,c,fase); return t!=null && c.en > t + 60000;   // 1 minuto de tolerancia
  };
  const cuantoTarde = (c,fase) => {
    if(fase==="vivo"){ const sec=secs.find(x=>x.id===c.secId); return sec&&sec.terminoEn ? c.en-sec.terminoEn : 0; }
    return c.en - horaCheck(r,c,fase);
  };
  const bloques = fases.map(([f,nombre])=>{
    const arr = r[f]||[]; const p = progreso(arr);
    const sin = arr.filter(c=>!c.hecho);
    const tar = arr.filter(c=>tarde(c,f));
    return `<div class="card">
      <div class="phase"><span>${nombre}</span><span class="pc">${p.h} de ${p.t} · ${tar.length} tarde · ${sin.length} sin cerrar</span></div>
      ${sin.map(c=>`<div class="it ro over" style="grid-template-columns:auto 1fr auto">
          <span class="box"></span><span class="tx">${esc(c.texto)} ${c.critico?'<span class="chip crit">crítico</span>':''}
          <span class="chip" style="color:${area(c.area).color}">${esc(area(c.area).nombre)}</span></span>
          <span class="mt">sin cerrar</span></div>`).join("")}
      ${tar.map(c=>`<div class="it ro done" style="grid-template-columns:auto 1fr auto">
          <span class="box"></span><span class="tx">${esc(c.texto)}
          <span class="chip" style="color:${area(c.area).color}">${esc(area(c.area).nombre)}</span></span>
          <span class="mt" style="color:var(--warn)">${esc(c.por||"—")} · ${fmtDur(cuantoTarde(c,f))} tarde</span></div>`).join("")}
      ${!sin.length && !tar.length ? '<div class="empty" style="padding:14px">Todo cerrado a tiempo.</div>' : ''}
    </div>`;
  }).join("");

  const dur = r.arrancoEn && finReal ? finReal - r.arrancoEn : null;
  const durPlan = h.fin - r.inicioMs;

  return cTopbar(`<a class="btn sm" href="#/">Admin</a><button class="btn sm no-print" onclick="window.print()">Imprimir</button>`) + `<div class="main stack" style="gap:18px">
    <div>
      <div class="k">Reporte de la reunión</div>
      <h1 style="font-size:28px;margin-top:4px">${esc(r.titulo)}</h1>
      <p class="muted" style="font-size:14px">${fechaLarga(r.fecha)} ${cerrada?"":"· <b>todavía no está cerrada</b>, el reporte es parcial"}</p>
    </div>
    <div class="cons-kpi tres" style="border:1px solid var(--line);border-radius:var(--r);overflow:hidden">
      <div><span class="k">Inicio</span><b class="mono">${r.arrancoEn?hhmm(r.arrancoEn):"—"}</b><span class="muted" style="font-size:12px">previsto ${r.hora}${r.arrancoEn?` · ${fmtDur(r.arrancoEn-r.inicioMs,true)}`:""}</span></div>
      <div><span class="k">Fin</span><b class="mono">${finReal?hhmm(finReal):"—"}</b><span class="muted" style="font-size:12px">previsto ${hhmm(h.fin)}${finReal?` · ${fmtDur(finReal-h.fin,true)}`:""}</span></div>
      <div><span class="k">Duración</span><b class="mono">${dur!=null?fmtDur(dur):"—"}</b><span class="muted" style="font-size:12px">prevista ${fmtDur(durPlan)}</span></div>
    </div>
    <div class="card">
      <div class="phase"><span>Secciones · planificado vs real</span></div>
      <div class="tbl-scroll"><table class="rep">
        <thead><tr><th>Sección</th><th>Previsto</th><th>Arrancó</th><th>Desvío</th><th>Duración</th><th>Real</th><th>Diferencia</th></tr></thead>
        <tbody>${filasSec || '<tr><td colspan="7" class="empty">Sin secciones.</td></tr>'}</tbody>
      </table></div>
    </div>
    ${bloques}
    ${r.notas?`<div class="card"><div class="phase"><span>Notas del productor</span></div>
      <div style="padding:12px 14px;font-size:14px;white-space:pre-wrap;color:var(--ink-2)">${esc(r.notas)}</div></div>`:""}
    <div class="muted" style="font-size:13px;max-width:60ch">Lo que quedó sin cerrar o se cerró tarde no es una falla del equipo: es la señal de qué ítems están mal escritos, mal asignados o sobran. Usalo para ajustar la plantilla antes del domingo que viene.</div>
  </div>`;
}

    </div>

// Último mensaje del chat dirigido a esta pantalla, visible 2 minutos.
const MSG_PANTALLA_MS = 2*60000;
function cMsgPantalla(r, destino){
  const ms = Object.values(r.chat||{}).filter(m=>m.para===destino).sort((a,b)=>(b.en||0)-(a.en||0));
  const m = ms[0];
  if(!m || ahora() - (m.en||0) > MSG_PANTALLA_MS) return "";
  return `<div class="tv-msg" data-hasta="${(m.en||0)+MSG_PANTALLA_MS}" style="background:var(--surface-2);border-color:${area(m.area).color};color:var(--ink)">
    <div class="tv-lbl" style="margin-bottom:6px">${esc(m.nombre)} · ${hhmm(m.en)}</div>${esc(m.texto)}</div>`;
}

function vEscenario(){
  const r=S.r;
  if(!r) return '<div class="center"><div class="empty">'+(S.sala===CFG.alias?'Todavía no hay una reunión activa.':'Esta reunión no existe.')+'</div></div>';
  const secs=r.secciones||[]; const i=r.secActiva;
  const cur=i!=null?secs[i]:null; const next=i!=null?secs[i+1]:secs[0];
  const rest = cur&&cur.arrancoEn ? cur.min*60000-(ahora()-cur.arrancoEn) : Math.max(0,r.inicioMs-ahora());
  if(r.estado==="cerrada") return `<div class="tv" style="justify-content:center;text-align:center">
    <div class="tv-lbl">Reunión terminada</div>
    <div class="big" style="font-size:clamp(60px,18vw,220px);color:var(--ink-2)">${r.cerradaEn?hhmm(r.cerradaEn):"—"}</div>
    <div class="tv-lbl">${esc(r.titulo)} · ${fechaLarga(r.fecha)}</div>
    <div class="tv-clock" style="text-align:center" id="tk-reloj2">${hhmm(ahora())}</div>
  </div>`;
  return `<div class="tv" style="justify-content:center;text-align:center">
    ${cur?`<div class="tv-cur">${esc(cur.titulo)}</div>`:`<div class="tv-lbl">Falta para arrancar</div>`}
    <div class="big" id="tk-esc" style="font-size:clamp(72px,22vw,280px);color:${rest<0?'var(--late)':'var(--ink)'}">${fmtDur(rest)}</div>
    ${next?`<div class="tv-next" style="justify-content:center"><span class="tv-lbl">Sigue</span><b>${esc(next.titulo)}</b></div>`:""}
    ${r.avisoPulpito?`<div class="tv-msg">${esc(r.avisoPulpito.texto)}</div>`:""}
    ${cMsgPantalla(r,"escenario")}
    <div class="tv-clock" style="text-align:center" id="tk-reloj2">${hhmm(ahora())}</div>
  </div>`;
}

function vPulpito(){
  const r=S.r;
  if(!r) return '<div class="center"><div class="empty">'+(S.sala===CFG.alias?'Todavía no hay una reunión activa.':'Esta reunión no existe.')+'</div></div>';
  const secs=r.secciones||[]; const i=r.secActiva;
  const cur=i!=null?secs[i]:null;
  const rest = cur&&cur.arrancoEn ? cur.min*60000-(ahora()-cur.arrancoEn) : null;
  const nv = rest==null ? "ok" : (rest > 5*60000 ? "ok" : rest > 0 ? "warn" : "late");
  const cerrada = r.estado==="cerrada";
  // antes de la prédica: cuánto falta para que le toque, sumando lo que resta de las secciones previas
  let faltaPred = null;
  if(r.estado==="en_vivo" && cur && !cur.esPredica && i!=null){
    const pi = secs.findIndex((x,k)=>k>i && x.esPredica);
    if(pi>-1){ faltaPred = Math.max(0,rest||0); for(let k=i+1;k<pi;k++) faltaPred += (secs[k].min||0)*60000; }
  }
  return `<div class="tv" style="justify-content:center;text-align:center;gap:clamp(14px,3vw,34px)">
    <div class="sem ${cerrada?'':nv}" style="height:clamp(14px,2.4vw,26px);${cerrada?'background:var(--line-2)':''}"></div>
    <div>
      ${cur&&!cerrada?`<div class="tv-cur">${esc(cur.titulo)}</div>`:`<div class="tv-lbl">${cerrada?"Reunión terminada":"La reunión no arrancó"}</div>`}
      <div class="big" id="tk-pul" style="font-size:clamp(76px,24vw,300px);color:var(--${cerrada?'ink-2':nv==='ok'?'ok':nv==='warn'?'warn':'late'})">
        ${cerrada||rest==null?"—":fmtDur(rest)}</div>
      <div class="tv-lbl">${cerrada?"":rest!=null&&rest<0?"te pasaste":"tiempo restante"}</div>
      ${faltaPred!=null?`<div class="tv-lbl" style="margin-top:10px;color:var(--ink-2)">tu bloque empieza en ~<span id="tk-pulpre">${Math.ceil(faltaPred/60000)}</span> min</div>`:""}
    </div>
    ${r.avisoPulpito?`<div class="tv-msg">${esc(r.avisoPulpito.texto)}</div>`:""}
    ${cMsgPantalla(r,"pulpito")}
    <div class="tv-clock" style="text-align:center" id="tk-reloj3">${hhmm(ahora())}</div>
  </div>`;
}

let modoLinks=false;

// Varias notificaciones seguidas (alias que se resuelve, auth, un update) → un solo render.
// Y siempre fuera del handler que lo pidió: renderizar en medio de un blur/change
// rompe la transición de foco del navegador (lo vimos en las pruebas).
let _renderPendiente=false;
function render(){
  if(_renderPendiente) return;
  _renderPendiente=true;
  setTimeout(()=>{ _renderPendiente=false; renderAhora(); }, 0);
}

function renderAhora(){
  const app=$("#app");
  const v=S.vista;
  const pantallas = ["cabina","escenario","pulpito","cartel"];
  document.documentElement.setAttribute("data-screen",
    (pantallas.includes(v) && v!=="cartel") ? "tv" : "app");

  // las pantallas de sala no piden identidad
  if(!pantallas.includes(v) && !S.yo){ app.innerHTML = vIdentidad(); return; }

  let html="";
  if(v==="admin")          html = (S.yo && !S.yo.admin) ? vLanding()
                                 : (modoLinks && S.r ? vLinks() : (S.editando ? vEditar() : vAdmin()));
  else if(v==="prod")      html = vProductor();
  else if(v==="consola")   html = vConsola();
  else if(v==="cartel")    html = vCartel();
  else if(v==="reporte")   html = vReporte();
  else if(v==="area")      html = vArea();
  else if(v==="live")      html = vLive();
  else if(v==="cabina")    html = vCabina();
  else if(v==="escenario") html = vEscenario();
  else if(v==="pulpito")   html = vPulpito();
  else html = vAdmin();

  // Cada cambio en la base re-renderiza todo. Si alguien está escribiendo en
  // ese momento, hay que devolverle el foco, el cursor Y lo que llevaba escrito:
  // sin esto, cada tilde que marca otro voluntario te borra el mensaje a medias.
  const foco = document.activeElement;
  const focoId = foco && (foco.id || (foco.dataset && foco.dataset.edit ? `${foco.dataset.edit}|${foco.dataset.i||""}|${foco.dataset.f||""}` : null));
  const esTexto = foco && (foco.tagName==="TEXTAREA" || (foco.tagName==="INPUT" && !["checkbox","radio","date","time"].includes(foco.type)));
  const valorFoco = esTexto ? foco.value : null;
  const selStart = esTexto ? foco.selectionStart : null;
  const selEnd   = esTexto ? foco.selectionEnd : null;
  const scrollMsgs = $("#msgs");
  const msgsAbajo = !scrollMsgs || (scrollMsgs.scrollHeight - scrollMsgs.scrollTop - scrollMsgs.clientHeight < 40);

  app.innerHTML = html;

  if(focoId){
    let el = document.getElementById(focoId);
    if(!el && focoId.includes("|")){
      const [e,i,f]=focoId.split("|");
      el = document.querySelector(`[data-edit="${e}"]${i?`[data-i="${i}"]`:""}[data-f="${f}"]`);
    }
    if(el && el.focus){
      if(valorFoco!=null && el.value!==valorFoco) el.value = valorFoco;
      el.focus();
      try{ if(selStart!=null && el.setSelectionRange) el.setSelectionRange(selStart, selEnd==null?selStart:selEnd); }catch(_){}
    }
  }
  // el chat sigue abajo solo si ya estaba abajo: si alguien scrolleó para leer, no se lo movemos
  const m=$("#msgs"); if(m && msgsAbajo) m.scrollTop = m.scrollHeight;
  tick();
}

/* ticker: solo toca los nodos de tiempo, no re-renderiza */
function tick(){
  const r=S.r;
  const set=(id,val)=>{ const e=document.getElementById(id); if(e) e.textContent=val; };
  const re=document.getElementById("tk-reloj"); if(re) re.textContent=hhmmss(ahora());
  set("tk-reloj2", hhmm(ahora())); set("tk-reloj3", hhmm(ahora()));
  if(!r) return;
  const cur = r.secActiva!=null ? (r.secciones||[])[r.secActiva] : null;
  const rest = cur&&cur.arrancoEn ? cur.min*60000-(ahora()-cur.arrancoEn) : null;

  if(rest!=null){
    ["tk-cur","tk-sec","tk-tv","tk-live","tk-area","tk-esc","tk-pul","tk-cons"].forEach(id=>set(id, fmtDur(rest)));
    const cn=document.getElementById("tk-cons"); if(cn) cn.style.color = rest<0?"var(--late)":"var(--ink)";
    const p=document.getElementById("tk-pul");
    if(p && r.estado==="en_vivo"){ const nv = rest>5*60000?"ok":rest>0?"warn":"late";
      p.style.color = `var(--${nv})`;
      const s=document.querySelector(".sem"); if(s) s.className="sem "+nv; }
    const pp=document.getElementById("tk-pulpre");
    if(pp && r.secActiva!=null){
      const secs=r.secciones||[]; const i=r.secActiva;
      const pi = secs.findIndex((x,k)=>k>i && x.esPredica);
      if(pi>-1){ let f=Math.max(0,rest); for(let k=i+1;k<pi;k++) f+=(secs[k].min||0)*60000; pp.textContent=Math.ceil(f/60000); }
    }
    const e=document.getElementById("tk-esc"); if(e) e.style.color = rest<0?"var(--late)":"var(--ink)";
    const t=document.getElementById("tk-tv"); if(t) t.style.color = rest<0?"var(--late)":"var(--ink)";
  } else {
    const f = Math.max(0, (r.inicioMs||0)-ahora());
    ["tk-falta","tk-tvfalta","tk-esc","tk-cons"].forEach(id=>set(id, fmtDur(f)));
  }
  document.querySelectorAll("[data-hasta]").forEach(el=>{ if(ahora() > +el.dataset.hasta) el.remove(); });
  const nd=document.getElementById("tk-nudge");
  if(nd) nd.hidden = !(r.estado==="preservicio" && ahora() > (r.inicioMs||0) + 60000);
  if(r.estado==="en_vivo"){
    const d=desvio(r);
    set("tk-desvio", fmtDur(d,true)); set("tk-tvdes", fmtDur(d,true)); set("tk-consdes", fmtDur(d,true));
    set("tk-tvfin", hhmm(finProyectado(r))); set("tk-consfin", hhmm(finProyectado(r)));
    if(r.arrancoEn) set("tk-consvivo", fmtDur(ahora()-r.arrancoEn));
  }
}
setInterval(tick, 500);

let areaElegida=null;

document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act;

  // --- identidad
  if(act==="pickarea"){
    areaElegida=b.dataset.id;
    $$("#areasBox .areabtn").forEach(x=>x.classList.toggle("on", x.dataset.id===areaElegida));
    return;
  }
  if(act==="entrar"){
    const n=($("#inNombre").value||"").trim();
    if(!n) return toast("Poné tu nombre");
    if(!areaElegida) return toast("Elegí tu área");
    guardarYo({nombre:n, areaId:areaElegida, admin:false});
    cambioIdentidad(); return;
  }
  if(act==="loginadmin"){
    if(HAY_FIREBASE){
      try{
        const res = await Store.loginAdmin();
        const mail = res.user.email||"";
        if(CFG.admins.length && !CFG.admins.includes(mail)){ toast("Ese mail no es admin"); await Store.logoutAdmin(); return; }
        guardarYo({nombre: (res.user.displayName||mail).split(" ")[0], areaId:"produccion", admin:true});
        cambioIdentidad();
      }catch(e){ toast("No se pudo entrar"); }
    } else {
      const pin = prompt("PIN de productor");
      if(pin===CFG.pinDemo){
        const n = prompt("Tu nombre","Facu") || "Productor";
        guardarYo({nombre:n, areaId:"produccion", admin:true}); cambioIdentidad();
      } else if(pin!=null) toast("PIN incorrecto");
    }
    return;
  }
  if(act==="salir"){
    if(confirm("¿Salir y cambiar de usuario?")){
      localStorage.removeItem("cabina.yo"); S.yo=null; areaElegida=null;
      if(HAY_FIREBASE) try{ await Store.logoutAdmin(); }catch(e){}
      cambioIdentidad();
    }
    return;
  }

  // --- admin
  if(act==="crear"){
    const pl=$("#nPl").value, f=$("#nFecha").value, h=$("#nHora").value;
    if(!f||!h) return toast("Falta fecha u hora");
    const r=nuevaReunion(pl,f,h);
    await Store.guardar(r.sala,r);
    toast("Reunión creada"); return;
  }
  if(act==="duplicar"){
    const orig=S.lista.find(x=>x.sala===b.dataset.sala); if(!orig) return;
    const f=prompt("Fecha de la nueva reunión (AAAA-MM-DD)", proximoDomingo()); if(!f) return;
    const copia=JSON.parse(JSON.stringify(orig));
    copia.sala=uid(4)+uid(4)+uid(4); copia.fecha=f; copia.inicioMs=epochDe(f,copia.hora);
    copia.estado="preservicio"; copia.arrancoEn=null; copia.cerradaEn=null; copia.secActiva=null;
    copia.creada=ahora(); copia.chat={}; copia.avisoPulpito=null;
    (copia.secciones||[]).forEach(s=>{s.arrancoEn=null;s.terminoEn=null;});
    ["pre","vivo","post"].forEach(k=>(copia[k]||[]).forEach(c=>{c.hecho=false;c.por=null;c.en=null;}));
    (copia.recordatorios||[]).forEach(x=>{x.hecho=false;});
    await Store.guardar(copia.sala,copia); toast("Duplicada"); return;
  }
  if(act==="editar"){ S.editando=b.dataset.sala; modoLinks=false; S.sala=b.dataset.sala; suscribir(); return; }
  if(act==="links"){ modoLinks=true; S.editando=null; S.sala=b.dataset.sala; suscribir(); return; }
  if(act==="volver"){ S.editando=null; modoLinks=false; S.sala=null; suscribir(); return; }
  if(act==="abrir"){ S.editando=null; modoLinks=false; irA("#/r/"+b.dataset.sala); return; }
  if(act==="consola"){ S.editando=null; modoLinks=false; irA("#/c/"+b.dataset.sala); return; }
  if(act==="borrar"){
    if(confirm("¿Borrar esta reunión? No se puede deshacer.")){
      if(S.activa===b.dataset.sala) await Store.activar(CFG.alias, null);  // que los links permanentes no apunten a la nada
      await Store.borrar(b.dataset.sala); toast("Borrada");
    }
    return;
  }
  if(act==="copiar"){ copiar(b.dataset.u); return; }
  if(act==="activar"){
    await Store.activar(CFG.alias, b.dataset.sala);
    toast("Los links permanentes apuntan a esta reunión"); return;
  }
  if(act==="cartel"){ irA("#/cartel"); return; }
  if(act==="reglas"){ S.verReglas=!S.verReglas; render(); return; }

  // --- edición de estructura
  if(act==="addsec"){
    const r=S.r; const secs=[...(r.secciones||[])];
    const ult = secs[secs.length-1];
    secs.push({id:"s"+secs.length+"_"+uid(3),bloque:(ult&&ult.bloque)||"",titulo:"Nueva sección",min:5,area:"produccion",esPredica:false,notas:"",arrancoEn:null,terminoEn:null});
    await Store.patch(r.sala,{secciones:secs}); return;
  }
  if(act==="delsec"){
    const r=S.r; const secs=[...(r.secciones||[])]; secs.splice(+b.dataset.i,1);
    await Store.patch(r.sala,{secciones:secs}); return;
  }
  if(act==="addcheck"){
    const f=b.dataset.fase; const r=S.r; const arr=[...(r[f]||[])];
    arr.push({id:"c"+f+arr.length+"_"+uid(3), texto:"Nuevo ítem", area:"produccion", critico:false,
      off: f==="post"?10:(f==="pre"?-30:null), secId: f==="vivo"?((r.secciones||[])[0]||{}).id||null:null,
      hecho:false,por:null,en:null});
    await Store.patch(r.sala,{[f]:arr}); return;
  }
  if(act==="delcheck"){
    const f=b.dataset.fase; const r=S.r; const arr=[...(r[f]||[])]; arr.splice(+b.dataset.i,1);
    await Store.patch(r.sala,{[f]:arr}); return;
  }

  // --- reunión en vivo
  if(act==="check"){ A.marcar(b.dataset.fase, b.dataset.id); return; }
  if(act==="iniciar"){ if(confirm("¿Arrancamos? Se fija la hora real de inicio.")) A.iniciar(); return; }
  if(act==="next"){ A.avanzar(1); return; }
  if(act==="prev"){ A.avanzar(-1); return; }
  if(act==="mas"){ A.ajustar(1); return; }
  if(act==="menos"){ A.ajustar(-1); return; }
  if(act==="cerrar"){ if(confirm("¿Cerrar la reunión? Arrancan los ítems post.")) A.cerrar(); return; }
  if(act==="reabrir"){ A.reabrir(); return; }
  if(act==="aviso"){ A.avisoPulpito(b.dataset.t||null); return; }
  if(act==="tab"){ S.tab=b.dataset.t; render(); return; }
  if(act==="solomio"){ S.soloMio = !filtroMio(); render(); return; }

  // --- chat
  if(act==="canal"){ S.canal=b.dataset.c; render(); return; }
  if(act==="rapido"){ A.enviar(b.dataset.t, destinoDe(S.canal)); return; }
  if(act==="enviar"){
    const i=$("#chatTxt"); if(!i) return;
    A.enviar(i.value, destinoDe(S.canal)); i.value=""; S.borrador="";
    return;
  }

  // --- notas y recordatorios
  if(act==="addrec"){
    const t=prompt("Recordatorio"); if(!t) return;
    const r=S.r; const arr=[...(r.recordatorios||[])];
    arr.push({texto:t, hecho:false});
    await Store.patch(r.sala,{recordatorios:arr}); return;
  }
  if(act==="rec"){
    const r=S.r; const i=+b.dataset.i; const arr=[...(r.recordatorios||[])];
    if(!arr[i]) return; arr[i]={...arr[i], hecho:!arr[i].hecho};
    await Store.patch(r.sala,{recordatorios:arr}); return;
  }
  if(act==="delrec"){
    const r=S.r; const arr=[...(r.recordatorios||[])]; arr.splice(+b.dataset.i,1);
    await Store.patch(r.sala,{recordatorios:arr}); return;
  }
  if(act==="irsec"){
    const r=S.r; const i=+b.dataset.i; if(r.estado!=="en_vivo") return;
    const p={};
    if(r.secActiva!=null) p[`secciones/${r.secActiva}/terminoEn`]=ahora();
    p[`secciones/${i}/arrancoEn`]=ahora(); p["secActiva"]=i;
    await Store.patch(r.sala,p); return;
  }
  if(act==="probarflash"){
    lanzarFlash({nombre:"Prueba", area:(S.yo?S.yo.areaId:"produccion"), para:"todos", texto:"Así se ve un mensaje"});
    return;
  }
});

// ---- que la pantalla no se apague en las vistas de sala ----
let _wake=null;
async function pedirWakeLock(){
  try{
    if(!("wakeLock" in navigator)) return;
    if(!["cabina","escenario","pulpito"].includes(parseHash().vista)) return;
    if(_wake && !_wake.released) return;
    _wake = await navigator.wakeLock.request("screen");
  }catch(e){}
}
pedirWakeLock();
window.addEventListener("hashchange", pedirWakeLock);
// el sistema suelta el wake lock cuando la pestaña se oculta; al volver hay que pedirlo de nuevo
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") pedirWakeLock(); });
